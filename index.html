<title>PPC Contratadas CPF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f4f7f7; --card: #ffffff; --fg: #14282c; --fg-2: #50666b; --fg-3: #8a9ba0; --line: #e3eaeb; --line-2: #d3dde0; --soft: #eef4f4;
  --brand: #007e7a; --brand-2: #0b3b3c; --brand-soft: #e1f2f0; --accent: #ecb11f;
  --ok: #2e9e6b; --ok-bg: #e3f5ec; --warn: #d99a00; --warn-bg: #fdf3d6; --bad: #d64545; --bad-bg: #fbe7e7; --info: #2a77b8; --info-bg: #e4f0fa; --na: #b9c5c8;
  --c-apia: #0b5c8c; --c-luk: #c43438; --c-milplan: #4e78ba; --c-all: #0b3b3c;
  --shadow: 0 1px 2px rgba(11, 59, 60, .05), 0 6px 20px -8px rgba(11, 59, 60, .12);
  --r: 14px; --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1718; --card: #132325; --fg: #e8f1f1; --fg-2: #a6bbbe; --fg-3: #6f8588; --line: #213538; --line-2: #2b4144; --soft: #182c2f;
    --brand: #2bb5ae; --brand-2: #08282a; --brand-soft: #123b3b; --ok: #3fbb83; --ok-bg: #12332a; --warn: #e6b422; --warn-bg: #3a3012; --bad: #ee6b6b; --bad-bg: #3b1d1f; --info: #5aa6e0; --info-bg: #14293a; --na: #3d5256;
    --c-apia: #4aa3d8; --c-luk: #ee6b6b; --c-milplan: #7f9fd6; --c-all: #cfe9e7; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -8px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1718; --card: #132325; --fg: #e8f1f1; --fg-2: #a6bbbe; --fg-3: #6f8588; --line: #213538; --line-2: #2b4144; --soft: #182c2f;
  --brand: #2bb5ae; --brand-2: #08282a; --brand-soft: #123b3b; --ok: #3fbb83; --ok-bg: #12332a; --warn: #e6b422; --warn-bg: #3a3012; --bad: #ee6b6b; --bad-bg: #3b1d1f; --info: #5aa6e0; --info-bg: #14293a; --na: #3d5256;
  --c-apia: #4aa3d8; --c-luk: #ee6b6b; --c-milplan: #7f9fd6; --c-all: #cfe9e7; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -8px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); margin: 0; overflow-x: hidden; font-feature-settings: 'tnum' 1, 'cv11' 1; }
h1, h2, h3, h4, p { margin: 0; }
h2 { font-size: 22px; letter-spacing: -.01em; font-weight: 700; text-wrap: balance; }
h3 { font-size: 15px; font-weight: 650; }
h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); margin: 22px 0 8px; font-weight: 600; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.muted { color: var(--fg-3); } .muted2 { color: var(--fg-2); } .sm { font-size: 12px; } .pad { padding: 0 14px 10px; }
.bad-t, .t-bad { color: var(--bad); } .t-ok { color: var(--ok); } .t-warn { color: var(--warn); } .t-na { color: var(--fg-3); }

/* topo */
.top { background: linear-gradient(135deg, var(--brand-2), #0e5a58); color: #fff; border-bottom: 3px solid var(--accent); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.brand p { font-size: 12px; color: #a8d0cd; }
.top-r { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: #cfe7e5; }
#theme { background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .22); color: #fff; padding: 6px 12px; border-radius: 99px; font-size: 12px; }
#theme:hover { background: rgba(255, 255, 255, .18); }
.tabsbar { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
#tabs { max-width: 1280px; margin: 0 auto; display: flex; gap: 2px; overflow-x: auto; padding: 0 max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); scrollbar-width: none; }
#tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 13px 15px; font-weight: 600; color: var(--fg-2); border-bottom: 3px solid transparent; white-space: nowrap; font-size: 13.5px; }
.tab:hover { color: var(--fg); } .tab.on { color: var(--brand); border-bottom-color: var(--brand); }
.wrap { max-width: 1280px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
#view.dragging { outline: 2px dashed var(--brand); outline-offset: 8px; border-radius: 12px; }
.foot { text-align: center; color: var(--fg-3); font-size: 12px; margin-top: 30px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--brand-2); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 13px; box-shadow: var(--shadow); z-index: 50; max-width: calc(100vw - 32px); text-align: center; }

/* logos */
.lg { display: inline-flex; align-items: center; justify-content: center; height: calc(var(--h) + 8px); padding: 3px 7px; border-radius: 7px; background: #fff; border: 1px solid var(--line); vertical-align: middle; flex: none; }
.lg img { height: var(--h); width: auto; max-width: 120px; display: block; object-fit: contain; }
.lg-apia { background: #16384f; border-color: #16384f; } .lg-vale { background: #fff; border-color: #fff; } .lg-custom, .lg-luk, .lg-milplan { background: #fff; border-color: var(--line-2); }
.emp { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; white-space: nowrap; } .emp .lg { padding: 2px 5px; }

/* superfícies */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card.empty { text-align: center; padding: 44px 20px; display: grid; gap: 12px; justify-items: center; } .card.empty p { max-width: 560px; color: var(--fg-2); }
.h { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--fg-3); font-weight: 650; margin: 0 0 12px; }
section + section.card, .card + .card { margin-top: 16px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; margin-top: 16px; }
.grid2.g-wide { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.grid2 > section.card + section.card, .grid2 > .card + .card { margin-top: 0; }
.stack { display: grid; gap: 16px; margin-top: 16px; } .stack > .card + .card { margin-top: 0; }
.phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; } .phead p { color: var(--fg-2); margin-top: 2px; }
.ctl { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; } .ctl-l { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-width: 0; }

/* controles */
.btn { background: var(--brand); color: #fff; border: 1px solid var(--brand); padding: 9px 18px; border-radius: 10px; font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 8px -3px var(--brand); }
.btn:hover { filter: brightness(1.07); } .btn.ghost { background: transparent; color: var(--brand); box-shadow: none; } .btn.ghost:hover { background: var(--brand-soft); } .sm-b { padding: 5px 11px; font-size: 12px; cursor: pointer; }
.lnk { background: none; border: 0; color: var(--brand); font-size: 12px; padding: 2px 4px; text-decoration: underline; text-underline-offset: 2px; }
select, input[type=date], input[type=number], input[type=search], .in-s { background: var(--card); border: 1px solid var(--line-2); border-radius: 9px; padding: 7px 10px; font-size: 13px; min-width: 0; max-width: 100%; }
select:focus, input:focus, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.in-s { width: 100%; min-width: 150px; }
.seg { display: inline-flex; background: var(--soft); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { background: none; border: 0; padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--fg-2); }
.seg button.on { background: var(--card); color: var(--brand); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.wk { display: inline-flex; gap: 4px; align-items: center; } .ib { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--card); font-size: 18px; line-height: 1; } .ib:disabled { opacity: .35; cursor: default; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { background: var(--card); border: 1px solid var(--line-2); border-radius: 99px; padding: 5px 13px 5px 8px; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: var(--fg-2); }
.pill:first-child { padding-left: 13px; } .pill.on { background: var(--brand); border-color: var(--brand); color: #fff; } .pill .lg { padding: 1px 4px; }
.pills.days { margin: 0; } .pill small { font-weight: 500; opacity: .75; } .dt { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--na); } .dt-ok { background: var(--ok); } .dt-warn { background: var(--warn); } .dt-bad { background: var(--bad); }
.pill.on .dt { box-shadow: 0 0 0 2px #fff; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 650; white-space: nowrap; margin: 1px 3px 1px 0; }
.chip-ok { background: var(--ok-bg); color: var(--ok); } .chip-warn { background: var(--warn-bg); color: var(--warn); } .chip-bad { background: var(--bad-bg); color: var(--bad); } .chip-info { background: var(--info-bg); color: var(--info); } .chip-mute { background: var(--soft); color: var(--fg-3); }

/* herói */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.5fr); gap: 26px; align-items: center; padding: 24px 28px; border-radius: 18px; color: #fff; background: linear-gradient(125deg, #0b3b3c 0%, #0e5a58 60%, #00807b 120%); box-shadow: 0 18px 40px -22px rgba(0, 70, 68, .6); position: relative; overflow: hidden; }
.hero::after { content: ''; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(closest-side, rgba(236, 177, 31, .28), transparent); pointer-events: none; }
.hero .gauge { display: block; } .hero .g-bg { stroke: rgba(255, 255, 255, .15); } .hero .g-t { fill: #fff; }
.hero .g-fg { stroke: var(--accent); } .hero .g-ok .g-fg { stroke: #5fe0a7; } .hero .g-bad .g-fg { stroke: #ff8c8c; }
.eyebrow { text-transform: uppercase; letter-spacing: .09em; font-size: 11.5px; font-weight: 650; color: #a8d0cd; }
.paper .eyebrow { color: var(--fg-3); }
.hero-n { font-size: 54px; line-height: 1.05; font-weight: 750; letter-spacing: -.03em; margin: 4px 0 6px; }
.hero-d { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; } .hero .muted2 { color: #b6d8d5; }
.delta { font-weight: 650; padding: 3px 10px; border-radius: 99px; background: rgba(255, 255, 255, .14); font-size: 12.5px; } .delta em { font-style: normal; font-weight: 500; opacity: .75; margin-left: 5px; }
.delta.up { background: rgba(95, 224, 167, .2); color: #8bf0c4; } .delta.dn { background: rgba(255, 140, 140, .2); color: #ffb1b1; }
.paper .delta { background: var(--soft); color: var(--fg-2); } .paper .delta.up { background: var(--ok-bg); color: var(--ok); } .paper .delta.dn { background: var(--bad-bg); color: var(--bad); }
.hero-k { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hk { background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .12); border-radius: 12px; padding: 10px 14px; } .hk b { font-size: 22px; display: block; font-weight: 700; letter-spacing: -.02em; } .hk span { font-size: 11.5px; color: #b6d8d5; text-transform: uppercase; letter-spacing: .05em; }
.cta { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 18px; padding: 16px 20px; border-radius: var(--r); background: var(--brand-soft); border: 1px solid var(--line); } .cta span { display: block; color: var(--fg-2); font-size: 13px; }

/* cards de empresa */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 16px; }
.ec { cursor: pointer; transition: transform .15s, box-shadow .15s; } .ec:hover { transform: translateY(-2px); }
.ec header { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; } .ec h3 { line-height: 1.2; } .ec header span { font-size: 12px; }
.ec-b { display: flex; gap: 16px; align-items: center; }
.ec dl { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; flex: 1; min-width: 0; } .ec dt { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: .05em; } .ec dd { margin: 0; font-weight: 700; font-size: 17px; }
.note { margin-top: 10px; font-size: 12px; background: var(--info-bg); color: var(--info); padding: 7px 10px; border-radius: 8px; }

/* gauge */
.gauge { flex: none; } .g-bg { fill: none; stroke: var(--line); stroke-width: 9; } .g-fg { fill: none; stroke-width: 9; stroke-linecap: round; transition: stroke-dasharray .5s; }
.g-t { font-size: 22px; font-weight: 750; fill: var(--fg); letter-spacing: -.03em; } .g-big .g-t { font-size: 25px; }
.g-ok .g-fg { stroke: var(--ok); } .g-warn .g-fg { stroke: var(--warn); } .g-bad .g-fg { stroke: var(--bad); } .g-na .g-fg { stroke: var(--na); }
.hero-n.g-ok, .hero-n.g-warn, .hero-n.g-bad { color: #fff; }

/* gráficos */
.chart { width: 100%; height: auto; display: block; overflow: visible; } .chart text { font-family: var(--font); }
.grid { stroke: var(--line); stroke-width: 1; } .meta { stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 5 4; } .meta-t { fill: var(--warn); font-weight: 600; }
.ax { fill: var(--fg-3); font-size: 11px; } .ax-on { fill: var(--brand); font-weight: 700; } .ax-dim { fill: var(--fg-3); opacity: .8; } .ax-sm { font-size: 9.5px; } .ax-l { fill: var(--fg-2); font-size: 12px; } .ax-n { fill: var(--fg); font-size: 12px; font-weight: 600; }
.ln { stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; } .ln-all { stroke: var(--c-all); stroke-width: 3; } .ln-apia { stroke: var(--c-apia); } .ln-luk { stroke: var(--c-luk); } .ln-milplan { stroke: var(--c-milplan); }
.dot { stroke: var(--card); stroke-width: 1.5; } .dot-all { fill: var(--c-all); } .dot-apia { fill: var(--c-apia); } .dot-luk { fill: var(--c-luk); } .dot-milplan { fill: var(--c-milplan); }
.bf-apia { fill: var(--c-apia); } .bf-luk { fill: var(--c-luk); } .bf-milplan { fill: var(--c-milplan); }
.pb { fill: var(--brand); } .pb-m { fill: var(--na); }
.rk-bg { fill: var(--soft); } .rk { fill: var(--na); } .rk-ok { fill: var(--ok); } .rk-warn { fill: var(--warn); } .rk-bad { fill: var(--bad); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; margin-bottom: 6px; color: var(--fg-2); } .lgd { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; background: var(--na); } .sw-ok { background: var(--ok); } .sw-warn { background: var(--warn); } .sw-bad { background: var(--bad); } .sw-all { background: var(--c-all); } .sw-apia { background: var(--c-apia); } .sw-luk { background: var(--c-luk); } .sw-milplan { background: var(--c-milplan); }
.sem { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-2); margin-top: 8px; } .sem span { display: inline-flex; gap: 6px; align-items: center; }
.mbar { display: inline-block; width: 70px; height: 7px; background: var(--soft); border-radius: 9px; overflow: hidden; vertical-align: middle; margin-right: 8px; } .mbar i { display: block; height: 100%; border-radius: 9px; background: var(--na); }
.b-ok { background: var(--ok) !important; } .b-warn { background: var(--warn) !important; } .b-bad { background: var(--bad) !important; } .bn { font-weight: 650; font-size: 12.5px; }

/* mapa do ano */
.strip-r { display: flex; align-items: center; gap: 12px; margin: 8px 0; } .strip-l { width: 108px; flex: none; font-size: 12.5px; font-weight: 600; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(6px, 1fr); gap: 3px; flex: 1; min-width: 0; } .strip i { height: 22px; border-radius: 4px; background: var(--na); opacity: .35; }
.strip i.h-ok { background: var(--ok); opacity: 1; } .strip i.h-warn { background: var(--warn); opacity: 1; } .strip i.h-bad { background: var(--bad); opacity: 1; }

/* tabelas */
.tw { overflow-x: auto; max-width: 100%; border-radius: 10px; } .tw.tall { max-height: 560px; overflow-y: auto; } .tw.tall2 { max-height: 420px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg-3); font-weight: 650; padding: 9px 12px; border-bottom: 1px solid var(--line-2); background: var(--card); position: sticky; top: 0; white-space: nowrap; z-index: 1; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:hover td { background: var(--soft); }
.r { text-align: right; } .c { text-align: center; } .desc { min-width: 220px; } .desc b { font-weight: 600; display: block; } .desc small, .mot { display: block; color: var(--fg-3); font-size: 11.5px; font-weight: 400; } .id { color: var(--fg-3); font-size: 12px; white-space: nowrap; }
tr.out td { opacity: .5; } tr.cur td { background: var(--brand-soft); }
table.dia th { text-align: center; } table.dia td:first-child { white-space: nowrap; }
.hc { text-align: center; font-weight: 700; color: #fff; font-size: 12.5px; } .h-ok.hc { background: var(--ok); } .h-warn.hc { background: var(--warn); } .h-bad.hc { background: var(--bad); } .h-na.hc { background: var(--soft); color: var(--fg-3); }
tbody tr:hover td.hc { filter: brightness(1.05); }
.cs { max-width: 190px; font-size: 12px; padding: 5px 8px; }
.tgl { position: relative; display: inline-block; width: 34px; height: 20px; } .tgl input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; } .tgl span { position: absolute; inset: 0; border-radius: 99px; background: var(--na); transition: .15s; } .tgl span::after { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .15s; } .tgl input:checked + span { background: var(--brand); } .tgl input:checked + span::after { transform: translateX(14px); }
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; } .filters input { flex: 1; min-width: 200px; }
table.acts { min-width: 1280px; }

/* equipes */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; } .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: grid; gap: 2px; box-shadow: var(--shadow); min-width: 0; } .kpi b { font-size: 26px; letter-spacing: -.02em; } .kpi small { color: var(--fg-3); font-size: 12px; } .kpi .lg { justify-self: start; } .sm-b2 { font-size: 15px !important; line-height: 1.3; }
table.tree td.tl { white-space: nowrap; } table.tree tr.lv1 td { background: var(--soft); font-weight: 650; } table.tree tr.lv2 td.tl { padding-left: 30px; } table.tree tr.lv3 td.tl { padding-left: 62px; color: var(--fg-2); }
tr.hid { display: none; } .caret { display: inline-block; width: 18px; cursor: pointer; color: var(--fg-3); transition: transform .15s; user-select: none; } .caret.closed { transform: rotate(-90deg); } .caret0 { display: inline-block; width: 18px; } .lead { color: var(--fg-2); font-size: 12.5px; }

 * Lê as planilhas de programação (Sprint Planning ÁPIA / LUK e PROG-SEM Milplan),

(function (root, factory) {

  const fmtBR = (iso) => iso.slice(8, 10) + '/' + iso.slice(5, 7);

  /* ---------- leitura de uma planilha (matriz de células) ---------- */
  const PROG = new Set(['PROG', 'P', 'PREV', 'PREVISTO']);
  const REAL = new Set(['REAL', 'R', 'REALIZADO']);

  function findHeader(rows) {
    for (let r = 0; r < Math.min(rows.length, 60); r++) {
      const row = rows[r] || [];
      let pr = -1, hasDesc = false;
      for (let c = 0; c < row.length; c++) {

  function mapColumns(row) {
    const m = {};

        const desc = clean(row[cols.desc]);
        if (!desc) continue;
        let rr = null;
        for (const k of [r + 1, r + 2]) {
          const rw = rows[k];
          if (rw && REAL.has(compact(rw[h.pr]))) { rr = rw; break; }
        }
        const P = {}, R = {};
        for (const c of dcs) {
          const p = num(row[c]);
          if (p != null) P[dates.map[c]] = p;
          if (rr) { const q = num(rr[c]); if (q != null) R[dates.map[c]] = q; }
        }
        const idv = clean(row[idCol]);
        const ls = cols.ls != null ? clean(row[cols.ls]) : '';
        let un = clean(row[cols.un]) || '';
        const act = {
          secao, ls, sup,
          idRaw: idv,
          id: kind === 'milplan' ? (ls + (idv ? ' · ' + idv : '')) : idv,
          frente: cols.frente != null ? clean(row[cols.frente]) : '',
          local: cols.local != null ? clean(row[cols.local]) : (kind === 'milplan' ? ls : ''),
          serv: cols.serv != null ? clean(row[cols.serv]) : '',
          desc,
          fiscal: cols.fiscal != null ? clean(row[cols.fiscal]) : '',
          resp: cols.resp != null ? clean(row[cols.resp]) : '',
          enc: cols.resp != null ? clean(row[cols.resp]) : '',
          meta: {}, cons: {},
          rac: cols.rac != null ? clean(row[cols.rac]) : '',
          un: un || '%',
          status: cols.status != null ? clean(row[cols.status]) : '',
          obs: cols.obs != null ? clean(row[cols.obs]) : '',
          grupo,
          lay: { local: cols.local != null, serv: cols.serv != null, resp: cols.resp != null },
          P, R,
        };
        const vals = Object.values(P).concat(Object.values(R));
        if (act.un === '%' && vals.some((v) => v > 1.5)) act.un = 'un';
        if (kind === 'milplan' && !act.fiscal) act.fiscal = '';
        acts.push(act);
        continue;
      }
      if (REAL.has(lab) || lab.startsWith('ADER')) continue;
      // linha de seção / cabeçalho de grupo
      if (kind === 'milplan') {
        const rsp = clean(row[cols.resp]);
        const b = clean(row[cols.ls]);
        if (/^SUP\./i.test(rsp)) {
          sup = rsp.replace(/^SUP\.\s*/i, '').split('/')[0].trim();
          grupo = clean(row[cols.desc]);
          lsCur = b;
        } else if (/^LS-\d+/i.test(b) && !clean(row[cols.desc])) {
          secao = b;
        }
      } else {
        const b = clean(row[cols.id != null ? Math.max(cols.id - 1, 0) : 0]) || clean(row[idCol]);
        const t = clean(row[idCol]) || clean(row[0]);
        if (!lab && t && !/^\d+([.,]\d+)?$/.test(t)) secao = t;
        else if (!lab && b && !/^\d+([.,]\d+)?$/.test(b)) secao = b;
      }
    }
    return {
      kind, cols, projeto, contratada,
      sheet: info.sheet, file: info.file,
      dates: Object.values(dates.map).sort(),
      acts,
    };
  }


  /* ---------- planilha-mestra "Entrada" (histórico PPC_Vale_MultiEmpresa) ---------- */
  function weekFromLabel(label, mtime) {
    const m = String(label || '').match(/(\d{1,2})\/(\d{1,2})/);
    if (!m) return null;
    const ref = mtime ? new Date(mtime) : new Date();
    let best = null;
    for (const y of [ref.getFullYear() - 1, ref.getFullYear(), ref.getFullYear() + 1]) {
      const iso = y + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');
      if (isNaN(Date.parse(iso)) || dow(iso) !== 0) continue;
      const dist = Math.abs(Date.parse(iso) - ref.getTime());
      if (!best || dist < best.dist) best = { iso, dist };
    }
    return best ? best.iso : null;
  }
  function pacoteEntrada(emp, pac) {
    const t = norm(pac);
    if (emp === 'ÁPIA') return 'ÁPIA · SLB III';
    if (emp === 'MILPLAN') return 'MILPLAN';
    if (/REDE/.test(t)) return 'REDE 13,8 kV SLB III';
    if (/AR COMPRIMIDO|PONTE ROLANTE/.test(t)) return 'AR COMPRIMIDO';
    return 'SPCI SLB III';
  }
  function parseEntrada(rows, info) {
    let hr = -1, c = {};
    for (let r = 0; r < Math.min(rows.length, 15); r++) {
      const row = rows[r] || [], m = {};
      row.forEach((v, i) => {
        const k = norm(v);
        if (k === 'EMPRESA') m.emp = i; else if (k.startsWith('SEMANA')) m.sem = i; else if (k === 'ATIVIDADE') m.desc = i;
        else if (k.startsWith('LS')) m.id = i; else if (k.startsWith('PACOTE')) m.pac = i; else if (k === 'UN') m.un = i;
        else if (k === 'FISCAL') m.fiscal = i; else if (k.startsWith('SUPERVISOR')) m.sup = i; else if (k.startsWith('ENCARREGADO')) m.enc = i;
        else if (k.startsWith('CONSID')) m.cons = i; else if (k.startsWith('CAUSA')) m.causa = i; else if (k.startsWith('RESPONSABILIDADE')) m.resp = i;
        else if (k.startsWith('OBSERV')) m.obs = i;
      });
      if (m.emp != null && m.desc != null && m.enc != null && m.cons != null && m.sem != null) { hr = r; c = m; break; }
    }
    if (hr < 0) return null;
    const acts = []; const dset = new Set();
    for (let r = hr + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const emp = clean(row[c.emp]), desc = clean(row[c.desc]);
      if (!emp || !desc) continue;
      const empresa = /APIA/.test(norm(emp)) ? 'ÁPIA' : /LUK/.test(norm(emp)) ? 'LUK' : /MILPLAN/.test(norm(emp)) ? 'MILPLAN' : emp;
      const ws = weekFromLabel(row[c.sem], info.mtime);
      if (!ws) continue;
      const P = {}, R = {};
      for (let i = 0; i < 7; i++) {
        const d = addDays(ws, i);
        const p = num(row[c.cons + 1 + i]), q = num(row[c.cons + 8 + i]);
        if (p != null) { P[d] = p; dset.add(d); }
        if (q != null) { R[d] = q; dset.add(d); }
      }
      const pac = clean(row[c.pac]);
      const consRaw = norm(row[c.cons]);
      const causa = clean(row[c.causa]), resp = clean(row[c.resp]), obs = clean(row[c.obs]);
      acts.push({
        entrada: true, empresa, pacote: pacoteEntrada(empresa, pac), secao: '', ls: empresa === 'MILPLAN' ? pac : '', sup: clean(row[c.sup]),
        idRaw: clean(row[c.id]), id: clean(row[c.id]), frente: pac, local: '', serv: '', desc,
        fiscal: clean(row[c.fiscal]), resp: clean(row[c.enc]), enc: clean(row[c.enc]), rac: '',
        un: clean(row[c.un]) || '%', status: '', obs, grupo: '', lay: { local: false, serv: false, resp: false },
        meta: causa || resp || obs ? { [ws]: { causa, resp, obs } } : {}, cons: { [ws]: consRaw !== 'N' }, P, R,
      });
    }
    if (!acts.length) return null;
    return { kind: 'entrada', cols: c, projeto: '', contratada: '', sheet: info.sheet, file: info.file, dates: [...dset].sort(), acts };
  }

  function parseCadastros(rows) {
    let hr = -1, c = {};
    for (let r = 0; r < Math.min(rows.length, 20); r++) {
      const row = rows[r] || [], m = {};
      row.forEach((v, i) => {
        const k = norm(v);
        if (k === 'FISCAL') m.fiscal = i; else if (k === 'DISCIPLINA') m.disc = i; else if (k === 'CAUSA') m.causa = i;
        else if (k.startsWith('RESPONSABILIDADE PADRAO')) m.rpad = i; else if (k === 'OPCAO') m.opc = i;
        else if (k === 'ENCARREGADO') m.enc = i; else if (k === 'SUPERVISOR' && m.enc != null && m.sup == null) m.sup = i;
      });
      if (m.fiscal != null && m.causa != null && m.enc != null) { hr = r; c = m; break; }
    }
    if (hr < 0) return null;
    const col = (i) => { const o = []; for (let r = hr + 1; r < rows.length; r++) { const v = clean((rows[r] || [])[i]); if (v && v.length < 60) o.push([v, r]); } return o; };
    const cad = { causas: [], resps: [], fiscais: [], encSup: {}, supers: [] };
    col(c.causa).forEach(([v, r]) => cad.causas.push({ k: v, resp: clean(rows[r][c.rpad]) }));
    col(c.opc).forEach(([v]) => cad.resps.push(v));
    col(c.fiscal).forEach(([v, r]) => cad.fiscais.push({ k: v, disc: clean(rows[r][c.disc]) }));
    for (let r = hr + 1; r < rows.length; r++) {
      const row = rows[r] || [], e = clean(row[c.enc]), sp = clean(row[c.sup]), emp = clean(row[c.enc - 1]);
      if (e && sp) { cad.encSup[norm(emp) + '|' + norm(e)] = sp; if (!cad.supers.includes(sp)) cad.supers.push(sp); }
    }
    return cad.causas.length || cad.fiscais.length ? cad : null;
  }

  /* ---------- identificação da empresa ---------- */
  const EMPRESAS = {
    'ÁPIA': { nome: 'ÁPIA', cor: '#0b3c5d' },
    LUK: { nome: 'LUK', cor: '#b3262b' },
    MILPLAN: { nome: 'MILPLAN', cor: '#1b3a63' },
  };

  function detect(block) {
    const txt = norm([block.projeto, block.contratada, block.sheet].join(' '));
    const fn = norm(block.file);
    const pick = (t) => {
      if (/MILPLAN/.test(t)) return { empresa: 'MILPLAN', pacote: 'MILPLAN' };
      if (/(^|[^0-9])271([^0-9]|$)|APIA|PROJETO CPF/.test(t)) return { empresa: 'ÁPIA', pacote: 'ÁPIA · SLB III' };
      if (/SPCI|INCENDIO/.test(t)) return { empresa: 'LUK', pacote: 'SPCI SLB III' };
      if (/REDE/.test(t)) return { empresa: 'LUK', pacote: 'REDE 13,8 kV SLB III' };
      if (/AR COMPRIMIDO|COMPRESSOR/.test(t)) return { empresa: 'LUK', pacote: 'AR COMPRIMIDO' };
      return null;
    };
    if (block.kind === 'milplan') return { empresa: 'MILPLAN', pacote: 'MILPLAN' };
    return pick(txt) || pick(fn) || null;
  }

  /* ---------- consolidação ---------- */
  const keyOf = (a) => [a.empresa, a.empresa === 'MILPLAN' ? a.ls : a.pacote, norm(a.idRaw), a.empresa === 'ÁPIA' ? '' : norm(a.local), norm(a.desc)].join('|');

  function merge(blocks, overrides = {}) {
    // blocos mais antigos primeiro; o mais recente prevalece. A planilha-mestra (Entrada) é base: só preenche semanas
    // que nenhuma programação (Sprint/PROG) cobre para a empresa e enriquece os demais com causa/fiscal.
    const sorted = blocks.slice().sort((a, b) => (a.mtime || 0) - (b.mtime || 0) || (a.prio || 0) - (b.prio || 0));
    const map = new Map();
    const conflicts = [];
    const used = [];
    const ent = [];
    for (const b of sorted) {
      if (b.kind === 'entrada') { used.push(b); ent.push(b); continue; }
      const det = overrides[b.id] || b.det;
      if (!det) continue;
      used.push(b);
      for (const a of b.acts) {
        const act = Object.assign({}, a, { empresa: det.empresa, pacote: det.pacote });
        const k = keyOf(act);
        const cur = map.get(k);
        if (!cur) {
          map.set(k, Object.assign(act, { key: k, P: Object.assign({}, a.P), R: Object.assign({}, a.R), meta: {}, cons: {}, fontes: [b.file + ' › ' + b.sheet] }));
          continue;
        }
        for (const d of Object.keys(a.P)) {
          if (cur.P[d] != null && Math.abs(cur.P[d] - a.P[d]) > EPS) conflicts.push({ key: k, d, tipo: 'P', antes: cur.P[d], depois: a.P[d], file: b.file });
          cur.P[d] = a.P[d];
        }
        for (const d of Object.keys(a.R)) {
          if (cur.R[d] != null && Math.abs(cur.R[d] - a.R[d]) > EPS) conflicts.push({ key: k, d, tipo: 'R', antes: cur.R[d], depois: a.R[d], file: b.file });
          cur.R[d] = a.R[d];
        }
        for (const f of ['fiscal', 'resp', 'enc', 'local', 'serv', 'frente', 'rac', 'sup', 'secao', 'grupo', 'un']) if (a[f]) cur[f] = a[f];
        if (a.status) cur.status = a.status;
        if (a.obs) cur.obs = a.obs;
        cur.fontes.push(b.file + ' › ' + b.sheet);
      }
    }
    if (ent.length) {
      const covered = {}; const byDesc = new Map();
      for (const a of map.values()) {
        const set = covered[a.empresa] || (covered[a.empresa] = new Set());
        for (const d of Object.keys(a.P)) if (a.P[d] > 0) set.add(weekStart(d));
        for (const d of Object.keys(a.R)) if (a.R[d] > 0) set.add(weekStart(d));
        const dk = a.empresa + '|' + norm(a.desc);
        (byDesc.get(dk) || byDesc.set(dk, []).get(dk)).push(a);
      }
      for (const b of ent) {
        for (const a of b.acts) {
          const cov = covered[a.empresa] || new Set();
          const P = {}, R = {};
          for (const d of Object.keys(a.P)) if (!cov.has(weekStart(d))) P[d] = a.P[d];
          for (const d of Object.keys(a.R)) if (!cov.has(weekStart(d))) R[d] = a.R[d];
          const peers = byDesc.get(a.empresa + '|' + norm(a.desc)) || [];
          if (!Object.keys(P).length && !Object.keys(R).length) {
            // semana coberta por programação: só enriquece
            for (const t of peers) {
              for (const w of Object.keys(a.meta)) if (!t.meta[w]) t.meta[w] = a.meta[w];
              for (const f of ['fiscal', 'enc', 'sup']) if (!t[f] && a[f]) t[f] = a[f];
            }
            continue;
          }
          const act = Object.assign({}, a, { P, R });
          const k = keyOf(act);
          const cur = map.get(k);
          if (!cur) { map.set(k, Object.assign(act, { key: k, meta: Object.assign({}, a.meta), cons: Object.assign({}, a.cons), fontes: [b.file + ' › ' + b.sheet] })); continue; }
          Object.assign(cur.P, P); Object.assign(cur.R, R); Object.assign(cur.meta, a.meta); Object.assign(cur.cons, a.cons);
          for (const f of ['fiscal', 'enc', 'sup', 'resp']) if (!cur[f] && a[f]) cur[f] = a[f];
        }
      }
    }
    return { acts: [...map.values()], conflicts, used };
  }

  function applyCadastro(acts, cad) {
    if (!cad) return;
    for (const a of acts) {
      if (!a.enc) a.enc = a.resp || '';
      if (!a.sup && a.enc) a.sup = cad.encSup[norm(a.empresa) + '|' + norm(a.enc)] || '';
    }
  }

  /* ---------- semanas / apuração ---------- */
  function weeksOf(acts) {
    const s = new Set();
    for (const a of acts) {
      for (const d of Object.keys(a.P)) if (a.P[d] > 0) s.add(weekStart(d));
      for (const d of Object.keys(a.R)) if (a.R[d] > 0) s.add(weekStart(d));
    }
    return [...s].sort();
  }
  const weekDays = (ws) => Array.from({ length: 7 }, (_, i) => addDays(ws, i));
  const weekNumber = (ws) => {
    // semana ISO
    const d = new Date(ws + 'T00:00:00Z');
    const th = new Date(d.getTime() + 3 * MS);
    const y = th.getUTCFullYear();
    const jan4 = new Date(Date.UTC(y, 0, 4));
    return 1 + Math.round(((th - jan4) / MS - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
  };

  // última data com realizado lançado (> 0) por empresa, limitada a hoje
  function lastReal(acts, empresa, hojeIso) {
    let m = null;
    for (const a of acts) {
      if (a.empresa !== empresa) continue;
      for (const d of Object.keys(a.R)) if (a.R[d] > 0 && d <= hojeIso && (!m || d > m)) m = d;
    }
    return m;
  }

  const DEFAULT_RULES = {
    exigirCampos: true,     // descrição, local, serviço e responsável preenchidos
    statusNaoIniciado: true, // A INICIAR / NÃO INICIADO sem realizado saem do PPC
    antecipadas: true,       // realizado sem previsto conta como programada e concluída
    cortarFuturo: true,      // ignora realizado depois da data de apuração
    respeitarN: true,        // respeita a marcação Consid. = N da planilha-mestra
  };
  const NAO_INICIADO = new Set(['A INICIAR', 'NAO INICIADO', 'NAO INICIADA', 'NAO INICIAD']);

  function computeWeek(acts, ws, opts) {
    const rules = Object.assign({}, DEFAULT_RULES, opts.rules || {});
    const cons = opts.cons || {};
    const apurado = opts.apurado || {};
    const days = weekDays(ws);
    const we = days[6];
    const out = [];
    for (const a of acts) {
      // apurado[empresa] === null → empresa sem realizado lançado: nada apurado (tudo "a apurar")
      const cut = apurado[a.empresa] === undefined ? we : (apurado[a.empresa] || '0000-00-00');
      const lim = cut < we ? cut : we;
      const hasProgWeek = days.some((d) => a.P[d] > 0);
      const hasRealWeek = days.some((d) => a.R[d] > 0);
      if (!hasProgWeek && !hasRealWeek) continue;
      const P = days.map((d) => (a.P[d] != null ? a.P[d] : null));
      let R = days.map((d) => (a.R[d] != null ? a.R[d] : null));
      if (rules.cortarFuturo) R = R.map((v, i) => (days[i] > lim ? null : v));
      const antecipada = !hasProgWeek && R.some((v) => v > 0);
      let Pe = P.slice();
      if (antecipada && rules.antecipadas) Pe = R.map((v) => (v > 0 ? v : null));
      const pAp = Pe.reduce((s, v, i) => s + (days[i] <= lim && v > 0 ? v : 0), 0);
      const rAp = R.reduce((s, v, i) => s + (days[i] <= lim && v > 0 ? v : 0), 0);
      const pTot = Pe.reduce((s, v) => s + (v > 0 ? v : 0), 0);
      const st = norm(a.status);
      let motivo = '';
      if (!hasProgWeek && !(antecipada && rules.antecipadas)) motivo = 'Sem previsto na semana';
      else if (rules.respeitarN && a.cons && a.cons[ws] === false) motivo = 'Marcada N (fora do PPC) na planilha';
      else if (rules.exigirCampos && (!a.desc || (a.lay.local && !a.local) || (a.lay.serv && !a.serv) || (a.lay.resp && !a.resp)))
        motivo = 'Campos obrigatórios em branco';
      else if (rules.statusNaoIniciado && NAO_INICIADO.has(st) && !hasRealWeek) motivo = 'Status ' + a.status + ' sem realizado';
      let considerar = !motivo;
      if (cons[a.key] === true) considerar = true;
      if (cons[a.key] === false) { considerar = false; motivo = motivo || 'Retirada manualmente'; }
      const programada = considerar && pAp > EPS;
      const ader = programada ? Math.min(1, rAp / pAp) : null;
      const concl = programada && rAp >= pAp - 1e-6;
      const parcial = programada && !concl && rAp > EPS;
      out.push({
        key: a.key, a, empresa: a.empresa, pacote: a.pacote, ws,
        P: Pe, R, pTot, pAp, rAp, antecipada, considerar, motivo,
        programada, concl, parcial, naoExec: programada && rAp <= EPS, ader,
        aguardando: considerar && pTot > EPS && pAp <= EPS, // programada para depois da data de apuração
        status: concl ? 'Concluída' : parcial ? 'Parcial' : programada ? 'Não executada' : (considerar && pTot > EPS ? 'A apurar' : 'Fora do PPC'),
      });
    }
    return out;
  }

  function summarize(rows, ws, apurado) {
    const days = weekDays(ws);
    const prog = rows.filter((r) => r.programada);
    const n = prog.length;
    const c = prog.filter((r) => r.concl).length;
    const p = prog.filter((r) => r.parcial).length;
    const x = prog.filter((r) => r.naoExec).length;
    const ader = n ? prog.reduce((s, r) => s + r.ader, 0) / n : null;
    // PPC diário
    const diario = days.map((d, i) => {
      const lim = apurado === undefined ? '9999-12-31' : (apurado || '0000-00-00');
      let np = 0, nc = 0, P = 0, R = 0, sa = 0;
      for (const r of rows) {
        if (!r.considerar) continue;
        const pv = r.P[i], rv = r.R[i];
        if (pv > 0) {
          P += pv; R += rv > 0 ? rv : 0;
          if (d <= lim) { np++; sa += Math.min(1, (rv || 0) / pv); if ((rv || 0) >= pv - 1e-6) nc++; }
        } else if (rv > 0) R += rv;
      }
      return { d, np, nc, sa, ppc: np ? nc / np : null, ader: np ? sa / np : null, P, R, apurado: d <= lim };
    });
    const dd = diario.filter((x) => x.ppc != null);
    return {
      n, c, p, x,
      ppc: n ? c / n : null,
      ader,
      ppcDiario: dd.length ? dd.reduce((s, x) => s + x.ppc, 0) / dd.length : null,
      diario,
      aApurar: rows.filter((r) => r.aguardando).length,
      fora: rows.filter((r) => !r.considerar).length,
      antecipadas: rows.filter((r) => r.antecipada && r.programada).length,
    };
  }

  /* agrega por chave arbitrária (fiscal, supervisor, frente…) */
  function groupBy(rows, fn) {
    const m = new Map();
    for (const r of rows) {
      if (!r.programada) continue;
      const k = fn(r) || '—';
      const g = m.get(k) || { k, n: 0, c: 0, p: 0, x: 0, sa: 0 };
      g.n++; g.sa += r.ader;
      if (r.concl) g.c++; else if (r.parcial) g.p++; else g.x++;
      m.set(k, g);
    }
    return [...m.values()].map((g) => Object.assign(g, { ppc: g.c / g.n, ader: g.sa / g.n })).sort((a, b) => b.n - a.n);
  }

  /* sugestão de causa a partir da observação / premissa */
  const CAUSAS = ['Material / suprimentos', 'Mão de obra', 'Equipamento / ferramenta', 'Projeto / engenharia', 'Liberação / permissão (PT)', 'Clima / acesso', 'Predecessora não concluída', 'Interferência de operação (Vale)', 'Reprogramação / replanejamento', 'Outros'];
  const RESPS = ['Contratada', 'Vale Capitais', 'Vale Manutenção', 'Vale Operação', 'Externo / clima'];

      g += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${yb(it.v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - B - yb(it.v)).toFixed(1)}" rx="5" class="${vital ? 'pb' : 'pb pb-m'}"><title>${esc(it.k)}: ${it.v} (${Math.round(100 * it.v / tot)}%)</title></rect><text x="${cx}" y="${yb(it.v) - 6}" text-anchor="middle" class="dl dl-n">${it.v}</text>`;
      g += `<circle cx="${cx}" cy="${H - B + 18}" r="10" class="nb"/><text x="${cx}" y="${H - B + 22}" text-anchor="middle" class="nbt">${i + 1}</text>`;
      const py = yp(acc / tot); d += (i ? 'L' : 'M') + cx.toFixed(1) + ' ' + py.toFixed(1);
      dots += `<circle cx="${cx}" cy="${py}" r="4" class="cdot"/><text x="${cx}" y="${py - 9}" text-anchor="middle" class="dl dl-c">${Math.round(100 * acc / tot)}%</text>`;
    });
    g += `<path d="${d}" class="cline" fill="none"/>${dots}`;
    acc = 0;
    const lst = items.map((it, i) => { acc += it.v; return `<li><b>${i + 1}</b><span>${esc(it.k)}</span><em>${it.v} · ${Math.round(100 * it.v / tot)}%</em></li>`; }).join('');
    return `<svg viewBox="0 0 ${Wd} ${H}" class="chart" role="img" aria-label="${esc(opts.aria || 'Pareto')}">${g}</svg><ol class="plg">${lst}</ol>`;
  }
  function paretoSvg(items, opts) {
    opts = opts || {};
    const tot = items.reduce((s, i) => s + i.v, 0);
    if (!tot) return '<p class="muted">Nenhuma atividade não concluída no período — nada a priorizar.</p>';
    const Wd = 720, rowH = 32; let acc = 0, out = ''; const lab = opts.label || 150; const mx = Math.max(...items.map((i) => i.v));
    items.forEach((it, i) => {
      const before = acc; acc += it.v; const w = Math.max(3, ((Wd - lab - 150) * it.v) / mx);
      const vital = before / tot < 0.8 && !it.neutro;
      out += `<g transform="translate(0 ${i * rowH + 4})"><text x="0" y="20" class="ax ax-l">${esc(it.k.length > 28 ? it.k.slice(0, 27) + '…' : it.k)}<title>${esc(it.k)}</title></text>
        <rect x="${lab}" y="5" width="${w.toFixed(1)}" height="19" rx="5" class="${vital ? 'pb' : 'pb pb-m'}"/>
        <text x="${(lab + w + 8).toFixed(1)}" y="20" class="ax ax-n">${it.v} · ${Math.round((100 * it.v) / tot)}%</text>
        <text x="${Wd}" y="20" text-anchor="end" class="ax ax-dim">${Math.round((100 * acc) / tot)}% acum.</text></g>`;
    });
    return `<svg viewBox="0 0 ${Wd} ${items.length * rowH + 8}" class="chart pareto" role="img" aria-label="${esc(opts.aria || 'Pareto')}">${out}</svg>`;
  }
  function rankChart(list) {
    // list: [{k, ppc, n}] barras horizontais coloridas pelo semáforo

        <rect x="${lab}" y="5" width="${Wd - lab - 70}" height="17" rx="5" class="rk-bg"/><rect x="${lab}" y="5" width="${Math.max(3, w).toFixed(1)}" height="17" rx="5" class="rk rk-${sem(it.ppc)}"/>

    return `<svg viewBox="0 0 ${Wd} ${list.length * rowH + 20}" class="chart" role="img" aria-label="Ranking de PPC">${out}</svg>`;

    }).join('');
    const R = S.rules;
    const rl = (k, t, d) => `<label class="sw-row"><input type="checkbox" data-rule="${k}" ${R[k] ? 'checked' : ''}><span class="tg" aria-hidden="true"></span><span><b>${t}</b><small>${d}</small></span></label>`;
    const apRows = empresas.map((e) => `<label class="apr">${logo(e, 18)}<span>${esc(e)}</span><input type="date" data-ap="${esc(e)}" value="${S.apEd[e] || apDef[e] || ''}" aria-label="Apurado até — ${esc(e)}">${apDef[e] ? '' : '<em class="muted">sem realizado</em>'}</label>`).join('');

      <div class="sem"><span><i class="sw sw-ok"></i>≥ meta</span><span><i class="sw sw-warn"></i>até 10 p.p. abaixo</span><span><i class="sw sw-bad"></i>abaixo disso</span></div></div></section></div>`;
  }

  /* ---------- Resumo (dia · semana · mês · ano) ---------- */
  function seriesFor(gran) {
    const mk = (label, st, on, sub) => ({ label, on, sub, v: Object.assign({ Todas: st.tot.ppc }, ...empresas.map((e) => ({ [e]: st.por[e].ppc }))), st });
    if (gran === 'semana') { const i = weeks.indexOf(S.ws); return weeks.slice(Math.max(0, i - 13), i + 1).map((w) => mk(wk(w), agg([w]), w === S.ws)); }
    if (gran === 'mes') { const i = months.indexOf(S.mes); return months.slice(Math.max(0, i - 11), i + 1).map((m) => mk(MES3[+m.slice(5, 7) - 1], agg(weeks.filter((w) => w.slice(0, 7) === m)), m === S.mes)); }
    if (gran === 'ano') return Array.from({ length: 12 }, (_, k) => { const ym = S.ano + '-' + String(k + 1).padStart(2, '0'); const ws = weeks.filter((w) => w.slice(0, 7) === ym); return mk(MES3[k], agg(ws), false); });
    // dia: dias da semana selecionada
    const { sm } = W(S.ws);
    return E.weekDays(S.ws).map((d, i) => {
      const por = {}; empresas.forEach((e) => { const z = sm.por[e].diario[i]; por[e] = { n: z.np, c: z.nc, ppc: z.ppc, ader: z.ader }; });
      const n = empresas.reduce((s, e) => s + por[e].n, 0), c = empresas.reduce((s, e) => s + por[e].c, 0);
      const sa = empresas.reduce((s, e) => s + (por[e].ader || 0) * por[e].n, 0);
      const tot = { n, c, ppc: n ? c / n : null, ader: n ? sa / n : null };
      return { label: E.DIAS[i], sub: E.fmtBR(d), on: d === S.dia, d, v: Object.assign({ Todas: tot.ppc }, ...empresas.map((e) => ({ [e]: por[e].ppc }))), st: { tot, por } };
    });
  }

  function subTable(rows) {
    // rows: [{label, st:{tot,por}}]
    const head = `<tr><th>Período</th>${empresas.map((e) => `<th colspan="2" class="c">${logo(e, 16)} ${esc(e)}</th>`).join('')}<th colspan="3" class="c">Consolidado</th></tr>`;
    const body = rows.map((r) => `<tr class="${r.on ? 'cur' : ''}"><td><b>${esc(r.label)}</b></td>${empresas.map((e) => `<td class="r muted">${r.st.por[e].n || '·'}</td>${heat(r.st.por[e].ppc, r.st.por[e].n)}`).join('')}<td class="r">${r.st.tot.n || '·'}</td>${heat(r.st.tot.ppc, r.st.tot.n)}<td class="r">${pct(r.st.tot.ader)}</td></tr>`).join('');

  }

  function insightsFor(v, por) {
    const out = []; const m = Math.round(S.meta * 100);
    if (v && v.n) {
      const need = Math.max(0, Math.ceil(S.meta * v.n - 1e-9) - v.c);
      if (v.ppc >= S.meta) out.push({ t: 'ok', x: `Meta de ${m}% atingida: PPC de ${pct(v.ppc)} (${v.c} de ${v.n} concluídas).` });
      else out.push({ t: v.ppc >= S.meta - 0.1 ? 'warn' : 'bad', x: `PPC de ${pct(v.ppc)}, ${Math.round((S.meta - v.ppc) * 100)} p.p. abaixo da meta de ${m}%. Faltaram ${need} atividade${need === 1 ? '' : 's'} concluída${need === 1 ? '' : 's'} para atingir a meta.` });
    }
    const L = empresas.map((e) => [e, por && por[e]]).filter(([, z]) => z && z.n && z.ppc != null && (z.p != null || z.x != null || z.c != null));
    const ap = apEff(); const L2 = L.filter(([e]) => ap[e]);
    if (L2.length > 1) {
      const s2 = L2.slice().sort((a, b) => b[1].ppc - a[1].ppc); const b = s2[0], w = s2[s2.length - 1];
      out.push({ t: 'ok', x: `Melhor desempenho: ${b[0]} com ${pct(b[1].ppc)} (${b[1].c}/${b[1].n}).` });
      if (w[1].ppc < S.meta) out.push({ t: 'bad', x: `Maior atenção: ${w[0]} com ${pct(w[1].ppc)} (${w[1].c}/${w[1].n}) — ${Math.round((S.meta - w[1].ppc) * 100)} p.p. abaixo da meta.` });
    } else if (L2.length === 1) { const b = L2[0]; out.push({ t: b[1].ppc >= S.meta ? 'ok' : 'warn', x: `${b[0]}: ${pct(b[1].ppc)} (${b[1].c}/${b[1].n}).` }); }
    const sa = empresas.filter((e) => por && por[e] && por[e].n && !ap[e]);
    if (sa.length) out.push({ t: 'info', x: `${sa.join(', ')}: programação lançada, aguardando apuração do realizado — não entra no PPC.` });
    return out;
  }
  function tabResumo() {

    let cur, prevTot, prevRef = '', titulo, sel = '';

      cur = { tot: pt.st.tot, por: pt.st.por, view: (emp) => (emp && emp !== 'Todas' && pt.st.por[emp] ? pt.st.por[emp] : pt.st.tot) };

      <div class="hero-k">${kp('Aderência', pct(v.ader))}${kp('Programadas', v.n)}${kp('Concluídas', v.c)}${kp('Parciais', v.p == null ? '·' : v.p)}${kp('Não executadas', v.x == null ? '·' : v.x)}${kp('Antecipadas', v.ant == null ? '·' : v.ant)}</div></section>`;
    const ap = apEff();
    const ins = insightsFor(v, cur.por);
    const insHtml = ins.length ? `<section class="card ins"><h3 class="h">Destaques</h3><ul>${ins.map((i) => `<li class="i-${i.t}"><i></i><span>${esc(i.x)}</span></li>`).join('')}</ul></section>` : '';
    const cards = empresas.filter((e) => S.emp === 'Todas' || S.emp === e).map((e) => {
      const z = cur.por[e]; const none = !ap[e] ? '<p class="note">Sem realizado lançado — programação aguardando apuração.</p>' : '';
      return `<article class="card ec" data-go="equipes" data-femp="${esc(e)}"><header>${logo(e, 26)}<div><h3>${esc(e)}</h3><span class="muted">${ap[e] ? 'apurado até ' + E.fmtBR(ap[e]) : 'sem apuração'}</span></div></header>
        <div class="ec-b">${gauge(z.ppc, 92)}<dl><div><dt>Aderência</dt><dd>${pct(z.ader)}</dd></div><div><dt>Programadas</dt><dd>${z.n}</dd></div><div><dt>Concluídas</dt><dd class="t-ok">${z.c}</dd></div><div><dt>Não exec.</dt><dd class="t-bad">${z.x == null ? '·' : z.x}</dd></div></dl></div>${none}</article>`;
    }).join('');
    const keys = ['Todas'].concat(empresas.filter((e) => S.emp === 'Todas' || S.emp === e));
    const chart = g === 'dia' || g === 'ano' ? barsChart(ser.map((p) => ({ label: p.label, sub: p.sub, on: p.on, v: p.v }))) : lineChart(ser, keys);
    const empV = empresas.filter((e) => S.emp === 'Todas' || S.emp === e);
    const dser = g === 'dia' || g === 'semana' ? seriesFor('dia') : null;
    const diaSec = dser ? `<div class="stack" id="s-dia"><section class="card"><h3 class="h">Previsto × realizado por dia</h3>${diaChart(dser, empV)}</section><section class="card"><h3 class="h">PPC por dia da semana</h3>${lineChart(dser, keys)}</section></div>` : '';
    const atWeeks = g === 'dia' ? [S.ws] : perInfo(g).weeks;

    const chartTit = { dia: 'PPC diário da semana', semana: 'Evolução semanal (14 semanas)', mes: 'Evolução mensal (12 meses)', ano: 'PPC mês a mês · ' + S.ano }[g];

    } else {
      detTit = { semana: 'Dia a dia da semana', mes: 'Semanas do mês', ano: 'Mês a mês' }[g];

      const strip = (e) => `<div class="strip-r"><span class="strip-l">${e === 'Todas' ? 'Consolidado' : logo(e, 15)}</span><div class="strip">${wl.map((w) => { const s = W(w).sm; const z = e === 'Todas' ? s : s.por[e]; return `<i class="h-${z.n ? sem(z.ppc) : 'na'}" title="${wk(w)} · ${wRange(w)}: ${z.n ? pct(z.ppc) : 'sem apuração'}"></i>`; }).join('')}</div></div>`;
      extra = `<section class="card"><h3 class="h">Mapa semanal do ano — cada quadrado é uma semana</h3>${['Todas'].concat(empresas).map(strip).join('')}<p class="muted sm">Verde = meta atingida · amarelo = até 10 p.p. abaixo · vermelho = abaixo · cinza = sem apuração.</p></section>`;
    }
    const ctl = `<div class="ctl"><div class="ctl-l">${seg([['dia', 'Dia'], ['semana', 'Semana'], ['mes', 'Mês'], ['ano', 'Ano']], g, 'data-gran')}${sel}</div>${empPills()}</div>`;
    const jump = `<nav class="jump" aria-label="Seções"><button data-jump="s-top">Visão geral</button><button data-jump="s-emp">Empresas</button><button data-jump="s-evo">Evolução</button>${dser ? '<button data-jump="s-dia">Dia a dia</button>' : ''}<button data-jump="s-at">Pontos de atenção</button></nav>`;
    return `${ctl}${jump}<span id="s-top"></span>${hero}${insHtml}<div class="cards" id="s-emp">${cards}</div>
      ${diaSec}<div class="stack" id="s-evo"><section class="card"><h3 class="h">${chartTit}</h3>${chart}</section><section class="card"><h3 class="h">${detTit}</h3>${det}</section></div>${extra}${atSec}
      <section class="cta"><div><b>Pronto para enviar?</b><span>Gere o relatório de ${esc(titulo)} em PDF (para apresentar) ou Excel (com todas as tabelas).</span></div><button class="btn" data-go="relatorio">Abrir relatório</button></section>`;
  }

  /* ---------- Atividades ---------- */
  function actRows() {
    let rows = rowsOf(S.ws); const f = S.f; const q = E.norm(f.q);
    if (f.emp) rows = rows.filter((r) => r.empresa === f.emp);
    if (f.fiscal) rows = rows.filter((r) => (r.a.fiscal || '—') === f.fiscal);
    if (f.status) rows = rows.filter((r) => r.status === f.status);
    if (q) rows = rows.filter((r) => E.norm([r.a.desc, r.a.local, r.a.serv, r.a.id, r.a.resp, r.a.fiscal, r.a.enc, r.a.sup].join(' ')).includes(q));
    return rows;
  }
  function tabAtividades() {
    if (!S.ws) return emptyState();
    const all = rowsOf(S.ws); const fiscais = [...new Set(all.map((r) => r.a.fiscal || '—'))].sort();
    const sts = ['Concluída', 'Parcial', 'Não executada', 'A apurar', 'Fora do PPC']; const f = S.f; const rows = actRows();
    const o = (arr, v, al) => `<option value="">${al}</option>` + arr.map((x) => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
    const bar1 = `<div class="filters"><input id="q" type="search" placeholder="Buscar atividade, local, responsável…" value="${esc(f.q)}" aria-label="Buscar"><select data-f="emp" aria-label="Empresa">${o(empresas, f.emp, 'Todas as empresas')}</select><select data-f="fiscal" aria-label="Fiscal">${o(fiscais, f.fiscal, 'Todos os fiscais')}</select><select data-f="status" aria-label="Status">${o(sts, f.status, 'Todos os status')}</select></div>`;
    const copt = (v) => `<option value="">—</option>` + causasList().map((c) => `<option ${c === v ? 'selected' : ''}>${esc(c)}</option>`).join('');
    const ropt = (v) => `<option value="">—</option>` + respsList().map((c) => `<option ${c === v ? 'selected' : ''}>${esc(c)}</option>`).join('');
    const body = rows.map((r) => {
      const a = r.a; const nao = r.programada && !r.concl;
      return `<tr class="${r.considerar ? '' : 'out'}"><td>${empTag(r.empresa, 16)}</td><td class="id">${esc(a.id)}</td><td class="desc"><b>${esc(a.desc)}</b><small>${esc([a.local, a.serv].filter(Boolean).join(' · '))}</small></td>
        <td>${esc(a.fiscal || '—')}</td><td>${esc(a.enc || '—')}</td><td>${esc(a.sup || '—')}</td><td>${esc(a.un)}</td>
        <td class="r">${fnum(r.pTot)}</td><td class="r">${fnum(r.pAp)}</td><td class="r">${fnum(r.rAp)}</td><td>${r.ader == null ? '—' : bar(r.ader) + '<span class="bn">' + pct(r.ader) + '</span>'}</td>
        <td>${chip(r.status)}${r.antecipada ? '<span class="chip chip-info">antecipada</span>' : ''}${r.motivo ? `<small class="mot">${esc(r.motivo)}</small>` : ''}</td>
        <td class="c"><label class="tgl" title="Considerar no PPC"><input type="checkbox" data-cons="${esc(r.key)}" ${r.considerar ? 'checked' : ''}><span></span></label></td>
        <td>${nao ? `<select class="cs" data-causa="${esc(r.key)}" aria-label="Causa">${copt(causaOf(r))}</select>` : ''}</td><td>${nao ? `<select class="cs" data-resp="${esc(r.key)}" aria-label="Responsabilidade">${ropt(respOf(r))}</select>` : ''}</td></tr>`;
    }).join('');
    return `${pageHead('Atividades', 'Programado × realizado de cada atividade. Ajuste o que conta no PPC e registre causa e responsabilidade.', weekCtl())}${bar1}<p class="muted sm">${rows.length} atividade(s) em ${wLabel(S.ws)}. Prev. ap. e Real. = valores apurados até a data de apuração.</p>
      <div class="tw tall"><table class="acts"><thead><tr><th>Empresa</th><th>ID</th><th>Atividade</th><th>Fiscal</th><th>Encarregado</th><th>Liderança</th><th>Un.</th><th class="r">Prev. sem.</th><th class="r">Prev. ap.</th><th class="r">Real.</th><th>Aderência</th><th>Status</th><th class="c">PPC</th><th>Causa</th><th>Responsab.</th></tr></thead><tbody>${body || '<tr><td colspan="15" class="muted">Nenhuma atividade com esses filtros.</td></tr>'}</tbody></table></div>`;
  }

  /* ---------- Equipes: empresa · fiscal · encarregado · liderança ---------- */
  const canon = (v) => E.norm(v || '—') || '—';
  function groupRows(rows, keyFn) {
    const m = new Map();
    for (const r of rows) {
      if (!r.programada) continue;
      const raw = keyFn(r) || '—', ck = canon(raw); const g = m.get(ck) || { k: raw, n: 0, c: 0, p: 0, x: 0, sa: 0, emps: new Set() };
      g.n++; g.sa += r.ader; g.emps.add(r.empresa);
      if (r.concl) g.c++; else if (r.parcial) g.p++; else g.x++;
      m.set(ck, g);
    }
    return [...m.values()].map((g) => Object.assign(g, { ppc: g.c / g.n, ader: g.sa / g.n }));
  }
  const gRow = (x, extra) => `<tr><td>${extra || ''}${esc(x.k)}</td><td class="r">${x.n}</td><td class="r t-ok">${x.c}</td><td class="r t-warn">${x.p}</td><td class="r t-bad">${x.x}</td><td>${bar(x.ppc)}<span class="bn t-${sem(x.ppc)}">${pct(x.ppc)}</span></td><td class="r">${pct(x.ader)}</td></tr>`;
  const gHead = (l) => `<thead><tr><th>${l}</th><th class="r">Prog.</th><th class="r">Conc.</th><th class="r">Parc.</th><th class="r">Não exec.</th><th>PPC</th><th class="r">Aderência</th></tr></thead>`;
  function tree(rows) {
    const out = [];
    const lvl = (arr, fn) => { const m = new Map(); arr.forEach((r) => { const raw = fn(r) || '—', ck = canon(raw); const o = m.get(ck) || { k: raw, rows: [] }; o.rows.push(r); m.set(ck, o); }); return [...m.values()]; };
    const stat = (arr) => { const g = { n: arr.length, c: 0, p: 0, x: 0, sa: 0 }; arr.forEach((r) => { g.sa += r.ader; if (r.concl) g.c++; else if (r.parcial) g.p++; else g.x++; }); g.ppc = g.c / g.n; g.ader = g.sa / g.n; return g; };
    for (const { k: emp, rows: ra } of lvl(rows, (r) => r.empresa)) {
      const id = emp; out.push({ lv: 1, id, par: '', label: `${logo(emp, 18)} <b>${esc(emp)}</b>`, s: stat(ra), lead: '' });
      for (const { k: fi, rows: rb } of lvl(ra, (r) => r.a.fiscal).sort((x, y) => y.rows.length - x.rows.length)) {
        const id2 = id + '>' + canon(fi); out.push({ lv: 2, id: id2, par: id, label: `<b>${esc(fi === '—' ? 'Sem fiscal informado' : fi)}</b> <span class="muted">fiscal</span>`, s: stat(rb), lead: '' });
        for (const { k: en, rows: rc } of lvl(rb, (r) => r.a.enc).sort((x, y) => y.rows.length - x.rows.length)) { const lead = [...new Set(rc.map((r) => r.a.sup).filter(Boolean))].join(', '); out.push({ lv: 3, id: id2 + '>' + canon(en), par: id2, label: esc(en === '—' ? 'Sem encarregado' : en), s: stat(rc), lead }); }
      }
    }
    return out;
  }
  function tabEquipes() {
    if (!S.ws) return emptyState();
    const info = perInfo(S.eq.per); const rows = rowsFor(info.weeks).filter((r) => r.programada && (S.emp === 'Todas' || r.empresa === S.emp));
    const vis = S.eq.vis; let body = '';
    const rank = (list) => rankChart(list.slice().sort((a, b) => a.ppc - b.ppc || b.n - a.n).slice(0, 14));
    const hier = tree(rows);
    if (vis === 'hier') {
      const trs = hier.map((t) => `<tr class="lv${t.lv} ${hidden(t) ? 'hid' : ''}" data-id="${esc(t.id)}" data-par="${esc(t.par)}">
        <td class="tl"><span class="${t.lv < 3 ? 'caret ' + (S.closed[t.id] ? 'closed' : '') : 'caret0'}" ${t.lv < 3 ? `data-tg="${esc(t.id)}"` : ''}>${t.lv < 3 ? '▾' : ''}</span>${t.label}</td><td class="r">${t.s.n}</td><td class="r t-ok">${t.s.c}</td><td class="r t-warn">${t.s.p}</td><td class="r t-bad">${t.s.x}</td><td>${bar(t.s.ppc)}<span class="bn t-${sem(t.s.ppc)}">${pct(t.s.ppc)}</span></td><td class="r">${pct(t.s.ader)}</td><td class="lead">${esc(t.lead || (t.lv === 3 ? '—' : ''))}</td></tr>`).join('');
      body = `<section class="card"><h3 class="h">Empresa › fiscal › encarregado</h3><div class="tw"><table class="tree">${gHead('Estrutura').replace('</tr></thead>', '<th>Liderança</th></tr></thead>')}<tbody>${trs || '<tr><td colspan="8" class="muted">Sem atividades programadas apuradas no período.</td></tr>'}</tbody></table></div><p class="muted sm">Clique nas setas para recolher. Liderança vem do cadastro (encarregado → supervisor) e pode ser editada na aba Fontes.</p></section>`;
    } else {
      const fn = { fiscal: (r) => r.a.fiscal, enc: (r) => r.a.enc, lider: (r) => r.a.sup || 'Sem liderança cadastrada' }[vis];
      const g = groupRows(rows, fn).sort((a, b) => b.n - a.n);
      const tit = { fiscal: 'Por fiscal de campo', enc: 'Por encarregado (empresa)', lider: 'Por liderança (supervisor)' }[vis];
      body = `<div class="grid2 g-wide"><section class="card"><h3 class="h">${tit} · ranking de PPC</h3>${rank(g)}</section><section class="card"><h3 class="h">${tit}</h3><div class="tw tall2"><table>${gHead('Nome')}<tbody>${g.map((x) => gRow(x, [...x.emps].map((e) => logo(e, 14)).join('') + ' ')).join('') || '<tr><td colspan="7" class="muted">Sem atividades programadas apuradas.</td></tr>'}</tbody></table></div></section></div>`;
    }
    const byEmp = empresas.filter((e) => S.emp === 'Todas' || S.emp === e).map((e) => { const rr = rows.filter((r) => r.empresa === e); const n = rr.length, c = rr.filter((r) => r.concl).length; return { e, n, c, ppc: n ? c / n : null }; });
    const kp = byEmp.map((z) => `<div class="kpi">${logo(z.e, 18)}<b class="t-${sem(z.ppc)}">${pct(z.ppc)}</b><small>${z.c} de ${z.n} · ${esc(z.e)}</small></div>`).join('');
    return `${pageHead('Equipes', `Quem entrega: PPC por empresa, fiscal, encarregado e liderança · ${esc(info.label)}`, '')}
      <div class="ctl"><div class="ctl-l">${seg([['hier', 'Hierarquia'], ['fiscal', 'Fiscal'], ['enc', 'Encarregado'], ['lider', 'Liderança']], vis, 'data-eqv')}${seg([['semana', 'Semana'], ['mes', 'Mês'], ['ano', 'Ano'], ['tudo', 'Acumulado']], S.eq.per, 'data-eqp')}${periodSelect(S.eq.per)}</div>${empPills()}</div>
      <div class="kpis">${kp}</div>${body}`;
  }
  const hidden = (t) => { let p = t.par; const m = {}; return false && m && p; };

  /* ---------- Pareto ---------- */
  function paretoData(info) {
    const rows = rowsFor(info.weeks).filter((r) => r.programada && !r.concl && (S.emp === 'Todas' || r.empresa === S.emp));
    const cnt = (fn, neutro) => { const m = new Map(); rows.forEach((r) => { const raw = fn(r), ck = canon(raw); const o = m.get(ck) || { k: raw, v: 0 }; o.v++; m.set(ck, o); }); return [...m.values()].map((o) => ({ k: o.k, v: o.v, neutro: neutro && neutro(o.k) })).sort((a, b) => (!!a.neutro - !!b.neutro) || b.v - a.v); };
    return {
      rows,
      causa: cnt((r) => causaOf(r) || 'Sem causa informada', (k) => k === 'Sem causa informada'),
      resp: cnt((r) => respOf(r) || 'Não classificada', (k) => k === 'Não classificada'),
      fiscal: cnt((r) => r.a.fiscal || 'Sem fiscal').slice(0, 10), enc: cnt((r) => r.a.enc || 'Sem encarregado').slice(0, 10), lider: cnt((r) => r.a.sup || 'Sem liderança cadastrada').slice(0, 10),
    };
  }
  function matrixEmpCausa(rows) {
    const cs = [...new Set(rows.map((r) => causaOf(r) || 'Sem causa informada'))]; const mx = {}; let max = 1;
    rows.forEach((r) => { const c = causaOf(r) || 'Sem causa informada'; const k = r.empresa; (mx[k] = mx[k] || {}); mx[k][c] = (mx[k][c] || 0) + 1; max = Math.max(max, mx[k][c]); });
    if (!cs.length) return '<p class="muted">Sem dados.</p>';
    return `<div class="tw"><table class="mx"><thead><tr><th></th>${cs.map((c) => `<th class="c vt"><span>${esc(c)}</span></th>`).join('')}<th class="c">Total</th></tr></thead><tbody>${empresas.filter((e) => mx[e]).map((e) => `<tr><td>${empTag(e, 16)}</td>${cs.map((c) => { const v = (mx[e] || {})[c] || 0; return `<td class="c mxc" style="--a:${(v / max).toFixed(2)}">${v || '·'}</td>`; }).join('')}<td class="c"><b>${Object.values(mx[e]).reduce((s, x) => s + x, 0)}</b></td></tr>`).join('')}</tbody></table></div>`;
  }
  function tabPareto() {
    if (!S.ws) return emptyState();
    const info = perInfo(S.pa.per); const d = paretoData(info);
    const copt = (v) => `<option value="">—</option>` + causasList().map((c) => `<option ${c === v ? 'selected' : ''}>${esc(c)}</option>`).join('');
    const ropt = (v) => `<option value="">—</option>` + respsList().map((c) => `<option ${c === v ? 'selected' : ''}>${esc(c)}</option>`).join('');
    const pend = d.rows.filter((r) => !(S.causa[r.ws + '|' + r.key] || (r.a.meta[r.ws] && r.a.meta[r.ws].causa))).slice(0, 30);
    const pendT = pend.length ? `<div class="tw tall2"><table><thead><tr><th>Semana</th><th></th><th>Atividade</th><th>Fiscal</th><th>Aderência</th><th>Causa</th><th>Responsab.</th></tr></thead><tbody>${pend.map((r) => `<tr><td>${wk(r.ws)}</td><td>${logo(r.empresa, 16)}</td><td class="desc"><b>${esc(r.a.desc)}</b><small>${esc(r.a.local || r.a.ls || '')}</small></td><td>${esc(r.a.fiscal || '—')}</td><td>${pct(r.ader)}</td><td><select class="cs" data-causa="${esc(r.key)}" data-cws="${r.ws}">${copt(causaOf(r))}</select></td><td><select class="cs" data-resp="${esc(r.key)}" data-cws="${r.ws}">${ropt(respOf(r))}</select></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Todas as atividades não concluídas já têm causa.</p>';
    const tot = d.rows.length;
    return `${pageHead('Pareto dos motivos', `Por que não cumprimos · ${esc(info.label)}`, '')}
      <div class="ctl"><div class="ctl-l">${seg([['semana', 'Semana'], ['mes', 'Mês'], ['ano', 'Ano'], ['tudo', 'Acumulado']], S.pa.per, 'data-pap')}${periodSelect(S.pa.per)}</div>${empPills()}</div>
      <div class="kpis"><div class="kpi"><small>Não concluídas</small><b>${tot}</b></div><div class="kpi"><small>Principal causa</small><b class="sm-b2">${esc(d.causa[0] && !d.causa[0].neutro ? d.causa[0].k : '—')}</b></div><div class="kpi"><small>Maior responsável</small><b class="sm-b2">${esc(d.resp[0] && !d.resp[0].neutro ? d.resp[0].k : '—')}</b></div></div>
      ${(() => { const nz = d.causa.filter((i) => i.neutro).reduce((q, i) => q + i.v, 0); return nz ? `<div class="banner"><b>${nz} de ${tot}</b> não conclusões ainda estão <b>sem causa informada</b> e ficam fora do gráfico. Classifique-as na tabela abaixo para um Pareto completo.</div>` : ''; })()}
      <div class="grid2 g-wide"><section class="card"><h3 class="h">Pareto das causas</h3>${paretoCombo(d.causa, { aria: 'Pareto das causas' })}<p class="muted sm">Barras escuras = causas que, somadas, explicam cerca de 80% das não conclusões. A linha mostra o acumulado.</p></section>
      <section class="card"><h3 class="h">Pareto da responsabilidade</h3>${paretoCombo(d.resp, { aria: 'Pareto da responsabilidade' })}<p class="muted sm">A responsabilidade padrão de cada causa vem do cadastro; ajuste atividade a atividade abaixo.</p></section></div>
      <section class="card"><h3 class="h">Empresa × causa</h3>${matrixEmpCausa(d.rows)}</section>
      <div class="grid2 g-wide"><section class="card"><h3 class="h">Quem mais acumula não conclusão · fiscal</h3>${paretoSvg(d.fiscal, { label: 150 })}</section><section class="card"><h3 class="h">Encarregado</h3>${paretoSvg(d.enc, { label: 190 })}</section></div>
      <section class="card" style="max-width:760px"><h3 class="h">Liderança</h3>${paretoSvg(d.lider, { label: 190 })}</section>
      <section class="card"><h3 class="h">Classificar causas e responsabilidades</h3>${pendT}</section>`;
  }

  /* ---------- Relatório ---------- */
  function reportData(per) {
    const info = perInfo(per); const a = agg(info.weeks); const rows = rowsFor(info.weeks);
    const prog = rows.filter((r) => r.programada);
    const emp = S.emp;
