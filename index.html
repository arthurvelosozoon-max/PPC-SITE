<style>
:root {
  --bg: #f4f7f7; --card: #ffffff; --fg: #14282c; --fg-2: #50666b; --fg-3: #8a9ba0; --line: #e3eaeb; --line-2: #d3dde0; --soft: #eef4f4;
  --brand: #007e7a; --brand-2: #0b3b3c; --brand-soft: #e1f2f0; --accent: #ecb11f;
  --ok: #2e9e6b; --ok-bg: #e3f5ec; --warn: #d99a00; --warn-bg: #fdf3d6; --bad: #d64545; --bad-bg: #fbe7e7; --info: #2a77b8; --info-bg: #e4f0fa; --na: #b9c5c8;
  --c-apia: #0b5c8c; --c-luk: #c43438; --c-milplan: #4e78ba; --c-all: #0b3b3c;
  --shadow: 0 1px 2px rgba(11, 59, 60, .05), 0 6px 20px -8px rgba(11, 59, 60, .12);
  --r: 14px; --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1718; --card: #132325; --fg: #e8f1f1; --fg-2: #a6bbbe; --fg-3: #6f8588; --line: #213538; --line-2: #2b4144; --soft: #182c2f;
    --brand: #2bb5ae; --brand-2: #08282a; --brand-soft: #123b3b; --ok: #3fbb83; --ok-bg: #12332a; --warn: #e6b422; --warn-bg: #3a3012; --bad: #ee6b6b; --bad-bg: #3b1d1f; --info: #5aa6e0; --info-bg: #14293a; --na: #3d5256;
    --c-apia: #4aa3d8; --c-luk: #ee6b6b; --c-milplan: #7f9fd6; --c-all: #cfe9e7; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -8px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1718; --card: #132325; --fg: #e8f1f1; --fg-2: #a6bbbe; --fg-3: #6f8588; --line: #213538; --line-2: #2b4144; --soft: #182c2f;
  --brand: #2bb5ae; --brand-2: #08282a; --brand-soft: #123b3b; --ok: #3fbb83; --ok-bg: #12332a; --warn: #e6b422; --warn-bg: #3a3012; --bad: #ee6b6b; --bad-bg: #3b1d1f; --info: #5aa6e0; --info-bg: #14293a; --na: #3d5256;
  --c-apia: #4aa3d8; --c-luk: #ee6b6b; --c-milplan: #7f9fd6; --c-all: #cfe9e7; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -8px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); margin: 0; overflow-x: hidden; font-feature-settings: 'tnum' 1, 'cv11' 1; }
h1, h2, h3, h4, p { margin: 0; }
h2 { font-size: 22px; letter-spacing: -.01em; font-weight: 700; text-wrap: balance; }
h3 { font-size: 15px; font-weight: 650; }
h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); margin: 22px 0 8px; font-weight: 600; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.muted { color: var(--fg-3); } .muted2 { color: var(--fg-2); } .sm { font-size: 12px; } .pad { padding: 0 14px 10px; }
.bad-t, .t-bad { color: var(--bad); } .t-ok { color: var(--ok); } .t-warn { color: var(--warn); } .t-na { color: var(--fg-3); }

/* topo */
.top { background: linear-gradient(135deg, var(--brand-2), #0e5a58); color: #fff; border-bottom: 3px solid var(--accent); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.brand p { font-size: 12px; color: #a8d0cd; }
.top-r { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: #cfe7e5; }
#theme { background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .22); color: #fff; padding: 6px 12px; border-radius: 99px; font-size: 12px; }
#theme:hover { background: rgba(255, 255, 255, .18); }
.tabsbar { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
#tabs { max-width: 1280px; margin: 0 auto; display: flex; gap: 2px; overflow-x: auto; padding: 0 max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); scrollbar-width: none; }
#tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 13px 15px; font-weight: 600; color: var(--fg-2); border-bottom: 3px solid transparent; white-space: nowrap; font-size: 13.5px; }
.tab:hover { color: var(--fg); } .tab.on { color: var(--brand); border-bottom-color: var(--brand); }
.wrap { max-width: 1280px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
#view.dragging { outline: 2px dashed var(--brand); outline-offset: 8px; border-radius: 12px; }
.foot { text-align: center; color: var(--fg-3); font-size: 12px; margin-top: 30px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--brand-2); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 13px; box-shadow: var(--shadow); z-index: 50; max-width: calc(100vw - 32px); text-align: center; }

/* logos */
.lg { display: inline-flex; align-items: center; justify-content: center; height: calc(var(--h) + 8px); padding: 3px 7px; border-radius: 7px; background: #fff; border: 1px solid var(--line); vertical-align: middle; flex: none; }
.lg img { height: var(--h); width: auto; max-width: 120px; display: block; object-fit: contain; }
.lg-apia { background: #16384f; border-color: #16384f; } .lg-vale { background: #fff; border-color: #fff; } .lg-custom, .lg-luk, .lg-milplan { background: #fff; border-color: var(--line-2); }
.emp { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; white-space: nowrap; } .emp .lg { padding: 2px 5px; }

/* superfícies */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card.empty { text-align: center; padding: 44px 20px; display: grid; gap: 12px; justify-items: center; } .card.empty p { max-width: 560px; color: var(--fg-2); }
.h { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--fg-3); font-weight: 650; margin: 0 0 12px; }
section + section.card, .card + .card { margin-top: 16px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; margin-top: 16px; }
.grid2.g-wide { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.grid2 > section.card + section.card, .grid2 > .card + .card { margin-top: 0; }
.stack { display: grid; gap: 16px; margin-top: 16px; } .stack > .card + .card { margin-top: 0; }
.phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; } .phead p { color: var(--fg-2); margin-top: 2px; }
.ctl { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; } .ctl-l { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-width: 0; }

/* controles */
.btn { background: var(--brand); color: #fff; border: 1px solid var(--brand); padding: 9px 18px; border-radius: 10px; font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 8px -3px var(--brand); }
.btn:hover { filter: brightness(1.07); } .btn.ghost { background: transparent; color: var(--brand); box-shadow: none; } .btn.ghost:hover { background: var(--brand-soft); } .sm-b { padding: 5px 11px; font-size: 12px; cursor: pointer; }
.lnk { background: none; border: 0; color: var(--brand); font-size: 12px; padding: 2px 4px; text-decoration: underline; text-underline-offset: 2px; }
select, input[type=date], input[type=number], input[type=search], .in-s { background: var(--card); border: 1px solid var(--line-2); border-radius: 9px; padding: 7px 10px; font-size: 13px; min-width: 0; max-width: 100%; }
select:focus, input:focus, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.in-s { width: 100%; min-width: 150px; }
.seg { display: inline-flex; background: var(--soft); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { background: none; border: 0; padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--fg-2); }
.seg button.on { background: var(--card); color: var(--brand); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

<script>
/* PPC Contratadas — motor de leitura e cálculo (sem dependência de DOM).
 * Lê as planilhas de programação (Sprint Planning ÁPIA / LUK e PROG-SEM Milplan),

(function (root, factory) {

  const MS = 86400000;

  const weekStart = (iso) => addDays(iso, -dow(iso));
  const DIAS = ['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'];
  const fmtBR = (iso) => iso.slice(8, 10) + '/' + iso.slice(5, 7);

  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : null;
    if (typeof v === 'string') {
      const t = v.trim();
      const m = t.match(/^(-?\d+(?:[.,]\d+)?)\s*(%?)$/);
      if (m) {

      }

    return null;
  }

  /* ---------- leitura de uma planilha (matriz de células) ---------- */
  const PROG = new Set(['PROG', 'P', 'PREV', 'PREVISTO']);
  const REAL = new Set(['REAL', 'R', 'REALIZADO']);

  function findHeader(rows) {
    for (let r = 0; r < Math.min(rows.length, 60); r++) {
      const row = rows[r] || [];
      let pr = -1, hasDesc = false;
      for (let c = 0; c < row.length; c++) {
        const k = compact(row[c]);
        if (k === 'P/R') pr = c;
        if (k === 'DESCRICAO' || k === 'ATIVIDADE') hasDesc = true;
      }
      if (pr >= 0 && hasDesc) return { r, pr };
    }
    return null;
  }

  function mapColumns(row) {
    const m = {};
    row.forEach((v, c) => {
      const k = norm(v);
      if (!k) return;
      if (k === 'LS') m.ls = c;
      else if (k.startsWith('ID')) m.id = c;
      else if (k === 'FRENTE') m.frente = c;
      else if (k === 'LOCAL') m.local = c;
      else if (k === 'SERVICO') m.serv = c;
      else if (k === 'DESCRICAO' || k === 'ATIVIDADE') m.desc = c;
      else if (k.includes('FISCAL')) m.fiscal = c;
      else if (k.startsWith('RESPONSAVEL')) m.resp = c;
      else if (k.startsWith('UNIDADE') || k === 'UN') m.un = c;
      else if (k === 'STATUS') m.status = c;
      else if (k.startsWith('OBSERVACOES')) m.obs = c;
      else if (k === 'RAC' || k === 'RACS') m.rac = c;

  }

  function findDates(rows, hr, pr) {
    let best = null;
    for (let r = hr; r <= hr + 4 && r < rows.length; r++) {
      const row = rows[r] || [];
      const map = {};
      let n = 0;
      for (let c = pr + 1; c < row.length; c++) if (isSerial(row[c])) { map[c] = serialToIso(row[c]); n++; }

  function cellAfter(rows, label, rMax = 14) {

  }

  function parseSheet(rows, info) {
    const h = findHeader(rows);
    if (!h) return null;
    const cols = mapColumns(rows[h.r]);
    if (cols.desc == null) return null;
    const dates = findDates(rows, h.r, h.pr);
    if (!dates) return null;
    const kind = cols.ls != null && norm(rows[h.r][cols.desc]) === 'ATIVIDADE' ? 'milplan' : 'sprint';

    const contratada = kind === 'milplan' ? cellAfter(rows, 'CONTRATADA:') : '';

    let secao = '', grupo = '', sup = '', lsCur = '';
    for (let r = dates.r + 1; r < rows.length; r++) {

          idRaw: idv,
          id: kind === 'milplan' ? (ls + (idv ? ' · ' + idv : '')) : idv,
          frente: cols.frente != null ? clean(row[cols.frente]) : '',
          local: cols.local != null ? clean(row[cols.local]) : (kind === 'milplan' ? ls : ''),
          serv: cols.serv != null ? clean(row[cols.serv]) : '',
          desc,
          fiscal: cols.fiscal != null ? clean(row[cols.fiscal]) : '',
          resp: cols.resp != null ? clean(row[cols.resp]) : '',
          enc: cols.resp != null ? clean(row[cols.resp]) : '',
          meta: {}, cons: {},
          rac: cols.rac != null ? clean(row[cols.rac]) : '',
          un: un || '%',
          status: cols.status != null ? clean(row[cols.status]) : '',
          obs: cols.obs != null ? clean(row[cols.obs]) : '',

  /* ---------- planilha-mestra "Entrada" (histórico PPC_Vale_MultiEmpresa) ---------- */
  function weekFromLabel(label, mtime) {
    const m = String(label || '').match(/(\d{1,2})\/(\d{1,2})/);
    if (!m) return null;
    const ref = mtime ? new Date(mtime) : new Date();
    let best = null;
    for (const y of [ref.getFullYear() - 1, ref.getFullYear(), ref.getFullYear() + 1]) {

    return best ? best.iso : null;
  }
  function pacoteEntrada(emp, pac) {
    const t = norm(pac);

    if (emp === 'MILPLAN') return 'MILPLAN';
    if (/REDE/.test(t)) return 'REDE 13,8 kV SLB III';

  }
  function parseEntrada(rows, info) {
    let hr = -1, c = {};
    for (let r = 0; r < Math.min(rows.length, 15); r++) {

        const k = norm(v);

        else if (k === 'FISCAL') m.fiscal = i; else if (k.startsWith('SUPERVISOR')) m.sup = i; else if (k.startsWith('ENCARREGADO')) m.enc = i;
        else if (k.startsWith('CONSID')) m.cons = i; else if (k.startsWith('CAUSA')) m.causa = i; else if (k.startsWith('RESPONSABILIDADE')) m.resp = i;
        else if (k.startsWith('OBSERV')) m.obs = i;
      });
      if (m.emp != null && m.desc != null && m.enc != null && m.cons != null && m.sem != null) { hr = r; c = m; break; }
    }
    if (hr < 0) return null;
    const acts = []; const dset = new Set();
    for (let r = hr + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const emp = clean(row[c.emp]), desc = clean(row[c.desc]);
      if (!emp || !desc) continue;
      const empresa = /APIA/.test(norm(emp)) ? 'ÁPIA' : /LUK/.test(norm(emp)) ? 'LUK' : /MILPLAN/.test(norm(emp)) ? 'MILPLAN' : emp;
      const ws = weekFromLabel(row[c.sem], info.mtime);
      if (!ws) continue;
      const P = {}, R = {};
      for (let i = 0; i < 7; i++) {
        const d = addDays(ws, i);

        if (p != null) { P[d] = p; dset.add(d); }
        if (q != null) { R[d] = q; dset.add(d); }
      }
      const pac = clean(row[c.pac]);
      const consRaw = norm(row[c.cons]);
      const causa = clean(row[c.causa]), resp = clean(row[c.resp]), obs = clean(row[c.obs]);
      acts.push({
        entrada: true, empresa, pacote: pacoteEntrada(empresa, pac), secao: '', ls: empresa === 'MILPLAN' ? pac : '', sup: clean(row[c.sup]),
        idRaw: clean(row[c.id]), id: clean(row[c.id]), frente: pac, local: '', serv: '', desc,
        fiscal: clean(row[c.fiscal]), resp: clean(row[c.enc]), enc: clean(row[c.enc]), rac: '',
        un: clean(row[c.un]) || '%', status: '', obs, grupo: '', lay: { local: false, serv: false, resp: false },

  }

  function parseCadastros(rows) {
    let hr = -1, c = {};
    for (let r = 0; r < Math.min(rows.length, 20); r++) {

    if (!t.trim()) return '';
    if (/INTERFER/.test(t)) return 'Interferência de operação (Vale)';
    if (/PREDECESS/.test(t)) return 'Predecessora não concluída';

    if (/MATERIAL|DISPONIBILIDADE|ENTREGA|FORNEC|COMPRA|SPOOL|SUPRIMENT/.test(t)) return 'Material / suprimentos';
    if (/EQUIP|GUINDASTE|MUNCK|PLATAFORMA|MAQUINA|FERRAMENTA|ANDAIME/.test(t)) return 'Equipamento / ferramenta';

    const anchors = [];
    const addA = (a) => { const n = anchors.find((x) => Math.abs(x.xc - a.xc) < thr); if (n) { if (a.name && !n.name) { n.name = a.name; n.text = a.text; } if (a.iso && !n.iso) n.iso = a.iso; if (a.pr) n.pr = true; } else anchors.push(a); };
    const hdr = items.filter((i) => i.y < headerBottom && i.y > dateY - 4 * hp && i.y < dataStart + 4 * hp);
    // datas (ano vem do contexto)
    const dates = dRow.items.sort((a, b) => a.xc - b.xc).map((i) => ({ i, dm: parseDM(i.s) }));
    let year = null; const years = {};
    items.forEach((i) => { const m = i.s.match(/\b\d{1,2}\/\d{1,2}\/(20\d\d)\b/); if (m) years[m[1]] = (years[m[1]] || 0) + 1; });
    const explicit = Object.keys(years).sort((a, b) => years[b] - years[a])[0];
    const wk = ((items.find((i) => /PROGRAMADAS\s*-\s*SEMANA\s+\d+/i.test(i.s)) || items.find((i) => /^SEMANA\s+\d+$/i.test(i.s)) || {}).s || '').replace(/\D+/g, '') || null;
    const cand = [ctx.nameYear, ctx.mtimeYear, ctx.nowYear].filter(Boolean);
    const fd = dates[0].dm;
    if (dates[0].dm.y) year = dates[0].dm.y;
    else if (explicit) year = +explicit;
    else {
      const tries = [...new Set(cand.concat(cand.map((y) => y - 1), cand.map((y) => y + 1)))];
      year = tries.find((y) => wk && isoWeek(y, fd.mo, fd.d) === +wk) || cand[0] || new Date().getFullYear();
    }
    let prevMo = null, yy = year;
    for (const o of dates) {
      if (prevMo != null && o.dm.mo < prevMo - 6) yy++;
      prevMo = o.dm.mo;
      const y = o.dm.y || yy;
      o.iso = serial(y, o.dm.mo, o.dm.d);
      addA({ xc: o.i.xc, iso: o.iso });
    }
    addA({ xc: prX, pr: true, name: 'P/R', text: 'P/R' });
    for (const i of hdr) {
      const k = norm(i.s);
      if (NAMES.test(k) && i.y <= headerBottom) { addA({ xc: i.xc, name: k, text: /^FIACAIS$|^FISCAI/.test(k) ? 'FISCAL' : i.s }); }
      else if (i.y >= dateY - 1 && i.y <= (wdY || dateY) + 0.3 * hp && i.xc !== prX && !parseDM(i.s) && !WD.test(i.s)) addA({ xc: i.xc });
    }
    anchors.sort((a, b) => a.xc - b.xc);

    /* itens de dados */
    const data = items.filter((i) => i.y > headerBottom);
    // cobertura horizontal para achar as fronteiras entre colunas
    const cov = data.map((i) => [i.x0, i.x1]).sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const c of cov) { const l = merged[merged.length - 1]; if (l && c[0] <= l[1] + 0.5) l[1] = Math.max(l[1], c[1]); else merged.push([c[0], c[1]]); }
    const bounds = [];
    for (let k = 0; k < anchors.length - 1; k++) {
      const a = anchors[k].xc, b = anchors[k + 1].xc;
      let best = null, cur = a;
      for (const m of merged) {
        if (m[1] <= a) continue; if (m[0] >= b) break;
        if (m[0] > cur && (!best || m[0] - cur > best[1] - best[0])) best = [cur, m[0]];
        cur = Math.max(cur, m[1]);
      }
      if (cur < b && (!best || b - cur > best[1] - best[0])) best = [cur, b];
      bounds.push(best && best[1] - best[0] > 0.8 ? (best[0] + best[1]) / 2 : (a + b) / 2);
    }
    const colOf = (x) => { let k = 0; while (k < bounds.length && x > bounds[k]) k++; return k; };
    const prIdx = anchors.findIndex((a) => a.pr);
    const dateIdx = new Set(anchors.map((a, k) => (a.iso ? k : -1)).filter((k) => k >= 0));
    const nameIdx = (n) => anchors.findIndex((a) => a.name === n);
    const idIdx = Math.max(0, nameIdx('ID'));
    const isMil = anchors.some((a) => a.name === 'ATIVIDADE') && anchors.some((a) => a.name === 'LS');
    const lsIdx = nameIdx('LS'), descIdx = anchors.findIndex((a) => a.name === 'DESCRICAO' || a.name === 'ATIVIDADE');

    /* blocos Prog./Real/Ader. */
    const blocks = [];
    for (let k = 0; k < labelsAll.length; k++) {
      const l = labelsAll[k], c = compact(l.s);
      if (!PROG.has(c)) continue;
      const b = { yP: l.y, yR: null, yA: null, label: l.s, labR: '', labA: '', cells: new Map(), P: new Map(), R: new Map() };
      for (let j = k + 1; j < labelsAll.length; j++) {
        const c2 = compact(labelsAll[j].s);
        if (PROG.has(c2)) break;
        if (REAL.has(c2) && b.yR == null) { b.yR = labelsAll[j].y; b.labR = labelsAll[j].s; }
        else if ((c2 === 'ADER' || c2 === 'ADERENCIA') && b.yA == null) { b.yA = labelsAll[j].y; b.labA = labelsAll[j].s; }
      }
      blocks.push(b);
    }
    const pitches = blocks.filter((b) => b.yR != null).map((b) => b.yR - b.yP);
    const defP = median(pitches) || 8 * (H / 842);
    for (const b of blocks) {
      b.pitch = b.yR != null ? b.yR - b.yP : defP;
      b.yEnd = b.yA != null ? b.yA : (b.yR != null ? b.yR : b.yP + b.pitch);
      b.cy = (b.yP + b.yEnd) / 2; b.half = (b.yEnd - b.yP) / 2 + 0.6 * b.pitch;
    }
    const labSet = new Set(labelsAll);
    const free = [];
    const put = (m, k, it) => { (m.get(k) || m.set(k, []).get(k)).push(it); };
    for (const it of data) {
      if (labSet.has(it)) continue;
      const k = colOf(it.xc);
      if (k === prIdx) continue;
      let hit = null;
      if (dateIdx.has(k)) {
        for (const b of blocks) {
          if (Math.abs(it.y - b.yP) <= 0.45 * b.pitch) { put(b.P, k, it); hit = b; break; }
          if (b.yR != null && Math.abs(it.y - b.yR) <= 0.45 * b.pitch) { put(b.R, k, it); hit = b; break; }
          if (it.y >= b.yP - 0.45 * b.pitch && it.y <= b.yEnd + 0.45 * b.pitch) { hit = b; break; }
        }
      } else {
        let bd = Infinity;
        for (const b of blocks) { const d = Math.abs(it.y - b.cy); if (d <= b.half && d < bd) { bd = d; hit = b; } }
        if (hit) put(hit.cells, k, it);
      }
      if (!hit) free.push({ it, k });
    }

    /* monta as linhas */
    const nC = anchors.length;
    const blank = () => new Array(nC).fill(null);
    const join = (arr) => arr.sort((a, b) => (Math.abs(a.y - b.y) > 2 ? a.y - b.y : a.x0 - b.x0)).map((x) => x.s).reduce((acc, t) => (acc ? acc + (/[^\s][-_/]$/.test(acc) ? '' : ' ') + t : t), '');
    const events = [];
    for (const b of blocks) events.push({ y: b.yP, kind: 'b', b });
    const fl = free.filter((f) => /[A-Za-z0-9À-ÿ]/.test(f.it.s) && (f.k !== prIdx || !LABELS.has(compact(f.it.s)))).sort((a, b) => a.it.y - b.it.y);
    const fRows = [];
    const ftol = Math.max(2, 0.3 * defP);
    for (const f of fl) { const g = fRows.find((r) => Math.abs(r.y - f.it.y) <= ftol); if (g) g.list.push(f); else fRows.push({ y: f.it.y, list: [f] }); }
    for (const r of fRows) events.push({ y: r.y, kind: 'f', r });
    events.sort((a, b) => a.y - b.y);

    const rows = [];
    const hrow = blank(); anchors.forEach((a, k) => { if (a.name) hrow[k] = a.text || a.name; }); hrow[prIdx] = 'P/R';
    rows.push(hrow);
    const drow = blank(); anchors.forEach((a, k) => { if (a.iso) drow[k] = a.iso; });
    rows.push(drow);
    for (const e of events) {
      if (e.kind === 'f') {
        const row = blank();
        const cells = new Map();
        e.r.list.forEach((f) => put(cells, f.k, f.it));
        const only = e.r.list.filter((f) => !dateIdx.has(f.k));
        if (isMil) {
          const t = join(only.map((f) => f.it).slice());
          if (only.length === 1 && /^LS-\d+/i.test(t)) { row[lsIdx] = t; }
          else for (const [k, v] of cells) { if (!dateIdx.has(k)) row[k] = join(v); }
        } else {
          const t = join(only.map((f) => f.it).slice());
          if (t) row[idIdx] = t;
        }
        rows.push(row);
        continue;
      }
      const b = e.b;
      const rp = blank(); for (const [k, v] of b.cells) rp[k] = join(v);
      rp[prIdx] = b.label; for (const [k, v] of b.P) rp[k] = join(v);
      rows.push(rp);
      const rr = blank(); rr[prIdx] = b.labR || 'Real'; for (const [k, v] of b.R) rr[k] = join(v);
      rows.push(rr);
      if (b.yA != null) { const ra = blank(); ra[prIdx] = b.labA || 'Ader.'; rows.push(ra); }
    }

    /* rótulos soltos: projeto / contratada */
    const below = (label) => {
      const lab = items.filter((i) => norm(i.s) === label).sort((a, b) => a.y - b.y)[0];
      if (!lab) return '';
      const c = items.filter((i) => i.y > lab.y + 2 && i.y < lab.y + 70 * (H / 842) && Math.abs(i.xc - lab.xc) < Math.max(40, (lab.x1 - lab.x0) * 1.2)).sort((a, b) => a.y - b.y);
      if (!c.length) return '';
      const y0 = c[0].y; return c.filter((i) => Math.abs(i.y - y0) <= 3).sort((a, b) => a.x0 - b.x0).map((i) => i.s).join(' ');
    };
    const wkItem = items.filter((i) => /PROGRAMADAS\s*-\s*SEMANA\s+\d+/i.test(i.s)).sort((a, b) => a.x0 - b.x0)[0] || items.find((i) => /PROGRAMADAS\s*-\s*SEMANA\s+\d+/i.test(i.s)) || items.find((i) => /^SEMANA\s+\d+$/i.test(i.s));
    const wkTxt = wkItem ? (wkItem.s.match(/SEMANA\s+\d+/i) || [''])[0] : '';
    return { rows, projeto: below('PROJETO'), contratada: below('CONTRATADA:'), semana: wkTxt, nBlocks: blocks.length };
  }

  /* lib = pdfjsLib; data = ArrayBuffer/Uint8Array; info = { name, mtime } */
  async function parse(lib, data, info) {
    info = info || {};
    const doc = await lib.getDocument({ data: new Uint8Array(data), disableFontFace: true, isEvalSupported: false }).promise;
    const nameY = ((String(info.name || '').match(/(20\d\d)/) || [])[1]) | 0;
    const ctx = { nameYear: nameY || null, mtimeYear: info.mtime ? new Date(info.mtime).getFullYear() : null, nowYear: new Date().getFullYear() };
    const out = []; let totalText = 0;
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p);
      const { items, W, H } = await pageItems(lib, page);
      totalText += items.length;
      const g = items.length ? buildGrid(items, W, H, ctx) : null;
      if (g && g.nBlocks) out.push(Object.assign({ name: 'PDF p.' + p + (g.semana ? ' · ' + g.semana.toUpperCase() : '') }, g));
    }
    if (doc.destroy) try { doc.destroy(); } catch (e) { /* ignore */ }
    return { sheets: out, pages: doc.numPages, hasText: totalText > 0 };
  }
  return { parse, buildGrid, parseDM };
});

  const $ = (s, el) => (el || document).querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = (v) => (v == null ? '—' : Math.round(v * 100) + '%');
  const fnum = (v) => (v == null ? '' : (Math.round(v * 100) / 100).toLocaleString('pt-BR'));
  const EMP_ORDER = ['ÁPIA', 'LUK', 'MILPLAN'];
  const LOGO_KEY = { 'ÁPIA': 'apia', LUK: 'luk', MILPLAN: 'milplan' };
  const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const MES3 = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const PACOTES = {
    auto: null,
    apia: { empresa: 'ÁPIA', pacote: 'ÁPIA · SLB III' },
    spci: { empresa: 'LUK', pacote: 'SPCI SLB III' },
    rede: { empresa: 'LUK', pacote: 'REDE 13,8 kV SLB III' },
    ar: { empresa: 'LUK', pacote: 'AR COMPRIMIDO' },
    milplan: { empresa: 'MILPLAN', pacote: 'MILPLAN' },
    ignorar: { ignorar: true },
  };
  const hojeIso = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };

  const store = {
    get(k, def) { try { const v = localStorage.getItem('ppc.' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
    set(k, v) { try { localStorage.setItem('ppc.' + k, JSON.stringify(v)); } catch (e) { /* sem storage */ } },
  };

  const S = {
    files: [], blocks: [], overrides: {}, merged: { acts: [], conflicts: [], used: [] }, cad: null,
    rules: Object.assign({}, E.DEFAULT_RULES, store.get('rules', {})),
    meta: store.get('meta2', 0.9),
    cons: store.get('cons', {}), causa: store.get('causa', {}), resp: store.get('resp', {}), supMap: store.get('supMap', {}), logos: store.get('logos', {}),
    apEd: {}, ws: null, mes: null, ano: null, dia: null, emp: 'Todas', tab: 'carregar', gran: 'semana',
    eq: { vis: 'hier', per: 'semana' }, pa: { per: 'semana' }, rel: { per: 'semana' }, closed: {},
    f: { q: '', status: '', fiscal: '', emp: '', di: '' }, busy: '', seq: 0,
  };
  const TABS = [['carregar', 'Carregar', '⇪'], ['resumo', 'Resumo', '◔'], ['atividades', 'Atividades', '☰'], ['equipes', 'Equipes', '⚑'], ['pareto', 'Pareto', '▥'], ['relatorio', 'Relatório', '⎙'], ['fontes', 'Fontes', 'ⓘ']];

  /* ---------- logos ---------- */
  const logoSrc = (k) => S.logos[k] || LOGOS[k] || '';
  function logo(emp, h) {
    const k = LOGO_KEY[emp]; if (!k) return '';
    const cls = S.logos[k] ? 'lg-custom' : 'lg-' + k;
    return `<span class="lg ${cls}" style="--h:${h || 22}px" title="${esc(emp)}"><img src="${logoSrc(k)}" alt="${esc(emp)}"></span>`;
  }
  const empTag = (emp, h) => `<span class="emp">${logo(emp, h)}<span class="emp-n">${esc(emp)}</span></span>`;

  /* ---------- leitura dos arquivos ---------- */
  const tick = () => new Promise((r) => setTimeout(r, 30));
  async function readFiles(list, opts) {
    opts = opts || {};
    const files = Array.from(list || []).filter((f) => /\.(xls[xmb]?|pdf)$/i.test(f.name));
    if (!files.length) { toast('Selecione arquivos Excel (.xlsx) ou PDF'); return; }
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      if (S.files.some((x) => x.name === f.name && x.size === f.size && x.mtime === f.lastModified)) continue;
      S.busy = `Lendo ${i + 1}/${files.length}: ${f.name}`; renderBusy(); await tick();
      const isPdf = /\.pdf$/i.test(f.name);
      const rec = { id: ++S.seq, name: f.name, size: f.size, mtime: f.lastModified, sheets: [], erro: '', tipo: isPdf ? 'pdf' : 'xlsx' };
      const addSheet = (n, rows, extra) => {
        const info = { file: f.name, sheet: n, mtime: f.lastModified };
        let b = E.parseSheet(rows, info);
        if (b && extra) { b.projeto = b.projeto || extra.projeto || ''; b.contratada = b.contratada || extra.contratada || ''; }
        if (!b && !isPdf && /ENTRADA/i.test(n)) b = E.parseEntrada(rows, info);
        if (!b) {
          const cad = !isPdf && /CADASTR/i.test(n) ? E.parseCadastros(rows) : null;
          if (cad) { rec.sheets.push({ name: n, status: 'cadastro', cad }); return; }
          rec.sheets.push({ name: n, status: 'ignorada' }); return;
        }
        b.id = ++S.seq; b.mtime = f.lastModified; b.det = b.kind === 'entrada' ? null : E.detect(b); b.fileId = rec.id; if (isPdf) b.fonte = 'pdf';
        S.blocks.push(b); rec.sheets.push({ name: n, status: 'ok', block: b });
      };
      try {
        const buf = await f.arrayBuffer();
        if (!opts.restore && S.proj) idb.put(S.proj + '|' + f.name + '|' + f.size + '|' + f.lastModified, { name: f.name, size: f.size, mtime: f.lastModified, buf });
        if (isPdf) {
          if (!window.pdfjsLib || !window.PDFGrid) throw new Error('o leitor de PDF não carregou — confira a internet e recarregue a página');
          const r = await window.PDFGrid.parse(window.pdfjsLib, buf, { name: f.name, mtime: f.lastModified });
          if (!r.hasText) throw new Error('este PDF é imagem (sem texto selecionável). Exporte o PDF direto do Excel ou envie o .xlsx');
          if (!r.sheets.length) throw new Error('não encontrei a tabela de programação (colunas P/R, datas e atividades). Envie o PDF gerado a partir do modelo de programação');
          r.sheets.forEach((sh) => addSheet(sh.name, sh.rows, sh));
        } else {
          const wb = XLSX.read(buf, { type: 'array', cellDates: false });
          const meta = (wb.Workbook && wb.Workbook.Sheets) || [];
          wb.SheetNames.forEach((n, ix) => {
            if (meta[ix] && meta[ix].Hidden) { rec.sheets.push({ name: n, status: 'oculta' }); return; }
            addSheet(n, XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: true }));
          });
        }
      } catch (e) { rec.erro = String(e && e.message || e); }
      S.files.push(rec);
    }
    S.busy = ''; recompute();
    if (opts.restore) return;

  function paretoCombo(items0, opts) {

    const Wd = 720, H = 300, L = 44, Rr = 46, T = 28, B = 40, n = items.length, gw = (Wd - L - Rr) / n, bw = Math.min(64, gw * 0.62);
    const mx = Math.max(...items.map((i) => i.v)); const top = Math.max(4, Math.ceil(mx * 1.15 / 2) * 2);
    const yb = (v) => T + (1 - v / top) * (H - T - B), yp = (f) => T + (1 - f) * (H - T - B);
    let g = ''; [0, 0.25, 0.5, 0.75, 1].forEach((t) => { g += `<line x1="${L}" x2="${Wd - Rr}" y1="${yp(t)}" y2="${yp(t)}" class="grid"/><text x="${Wd - Rr + 8}" y="${yp(t) + 4}" class="ax">${t * 100}%</text><text x="${L - 8}" y="${yp(t) + 4}" text-anchor="end" class="ax">${Math.round(t * top)}</text>`; });

    let acc = 0, d = '', dots = '';

  function paretoSvg(items, opts) {

  /* ---------- Resumo (dia · semana · mês · ano) ---------- */
  function seriesFor(gran) {
    const mk = (label, st, on, sub) => ({ label, on, sub, v: Object.assign({ Todas: st.tot.ppc }, ...empresas.map((e) => ({ [e]: st.por[e].ppc }))), st });
    if (gran === 'semana') { const i = weeks.indexOf(S.ws); return weeks.slice(Math.max(0, i - 13), i + 1).map((w) => mk(wk(w), agg([w]), w === S.ws)); }
    if (gran === 'mes') { const i = months.indexOf(S.mes); return months.slice(Math.max(0, i - 11), i + 1).map((m) => mk(MES3[+m.slice(5, 7) - 1], agg(weeks.filter((w) => w.slice(0, 7) === m)), m === S.mes)); }
    if (gran === 'ano') return Array.from({ length: 12 }, (_, k) => { const ym = S.ano + '-' + String(k + 1).padStart(2, '0'); const ws = weeks.filter((w) => w.slice(0, 7) === ym); return mk(MES3[k], agg(ws), false); });
    // dia: dias da semana selecionada
    const { sm } = W(S.ws);
    return E.weekDays(S.ws).map((d, i) => {
      const por = {}; empresas.forEach((e) => { const z = sm.por[e].diario[i]; por[e] = { n: z.np, c: z.nc, ppc: z.ppc, ader: z.ader }; });
      const n = empresas.reduce((s, e) => s + por[e].n, 0), c = empresas.reduce((s, e) => s + por[e].c, 0);
      const sa = empresas.reduce((s, e) => s + (por[e].ader || 0) * por[e].n, 0);
      const tot = { n, c, ppc: n ? c / n : null, ader: n ? sa / n : null };
      return { label: E.DIAS[i], sub: E.fmtBR(d), on: d === S.dia, d, v: Object.assign({ Todas: tot.ppc }, ...empresas.map((e) => ({ [e]: por[e].ppc }))), st: { tot, por } };
    });
  }

  function insightsFor(v, por) {

  const canon = (v) => E.norm(v || '—') || '—';

  /* ---------- senha de acesso por projeto (barreira no navegador) ---------- */
  const sha256 = (s) => {
